<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>薄肌比例导航</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: phone app shell — top bar / scrolling view / bottom tab bar; framed as a phone on wide screens. */
:root{
  --desk:#dfe5e2; --bg:#f3f5f3; --surface:#ffffff; --ink:#16201e; --muted:#5a6764; --line:#dde3e0;
  --accent:#0d6b63; --accent-ink:#ffffff; --accent-soft:#dcefeb; --boost:#79b9ae; --keep:#e7ece9; --less:#a5afac;
  --body:#cbd5d1; --body-line:#9fb0ab; --warm:#c96a0a; --warm-soft:#fbead6;
  --display:"Bricolage Grotesque","PingFang SC","Noto Sans SC",system-ui,sans-serif;
  --text:"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --desk:#090d0c; --bg:#0f1514; --surface:#172120; --ink:#e6eeec; --muted:#9aaeaa; --line:#26322f;
  --accent:#4cbcae; --accent-ink:#06201d; --accent-soft:#183a35; --boost:#2c776e; --keep:#222d2b; --less:#5f6f6c;
  --body:#33403e; --body-line:#4d5f5b; --warm:#f0a347; --warm-soft:#3a2a17; color-scheme:dark}}
:root[data-theme="dark"]{
  --desk:#090d0c; --bg:#0f1514; --surface:#172120; --ink:#e6eeec; --muted:#9aaeaa; --line:#26322f;
  --accent:#4cbcae; --accent-ink:#06201d; --accent-soft:#183a35; --boost:#2c776e; --keep:#222d2b; --less:#5f6f6c;
  --body:#33403e; --body-line:#4d5f5b; --warm:#f0a347; --warm-soft:#3a2a17; color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--desk);color:var(--ink);font-family:var(--text);font-size:15px;line-height:1.55;overflow:hidden}
button{font:inherit;color:inherit}
.app{position:relative;height:100%;max-width:440px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
@media (min-width:600px){.app{height:calc(100% - 48px);max-height:900px;margin-top:24px;border-radius:32px;border:1px solid var(--line);box-shadow:0 20px 60px rgba(0,0,0,.18)}}

/* top bar */
.top{flex:none;display:grid;grid-template-columns:48px minmax(0,1fr) 48px;align-items:center;height:54px;padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px));background:var(--bg);border-bottom:1px solid transparent}
.top.lvl2,.top.lvl3{border-bottom-color:var(--line);background:var(--surface)}
.top h1{margin:0;text-align:center;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top.lvl1 h1{text-align:left;font-family:var(--display);font-size:22px;font-weight:700;padding-left:12px;grid-column:1 / 3}
.iconbtn{width:44px;height:44px;border:0;background:transparent;border-radius:12px;display:grid;place-items:center;cursor:pointer}
.iconbtn:active{background:var(--keep)}
.iconbtn svg{width:22px;height:22px}
.crumb{grid-column:1 / -1;font-size:11px;color:var(--muted);text-align:center;margin-top:-8px;letter-spacing:.04em}

/* view */
.view{flex:1;overflow-y:auto;overscroll-behavior:contain;padding-block:12px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.view>*{flex-shrink:0}
.view.fwd{animation:inR .24s ease-out}
.view.back{animation:inL .24s ease-out}
.view.fade{animation:fadeIn .18s ease-out}
@keyframes inR{from{transform:translateX(28px);opacity:.3}to{transform:none;opacity:1}}
@keyframes inL{from{transform:translateX(-28px);opacity:.3}to{transform:none;opacity:1}}
@keyframes fadeIn{from{opacity:.4}to{opacity:1}}
@media (prefers-reduced-motion: reduce){.view{animation:none!important}*{transition:none!important}}

/* tab bar */
.tabs{flex:none;display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 10px;font-size:11px;color:var(--muted);cursor:pointer}
.tabs button svg{width:24px;height:24px}
.tabs button[aria-current="page"]{color:var(--accent);font-weight:600}

/* building blocks */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.hero{background:var(--accent);color:var(--accent-ink);border:0}
.hero .muted{color:inherit;opacity:.8}
.eyebrow{font-size:11.5px;letter-spacing:.1em;color:var(--muted);font-weight:600;margin:0}
.hero .eyebrow{color:inherit;opacity:.8}
h2{font-family:var(--display);font-size:21px;line-height:1.3;margin:4px 0 0;text-wrap:balance}
h3{font-size:15px;margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
p{margin:0}
.stack{display:flex;flex-direction:column;gap:10px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.section-h{display:flex;justify-content:space-between;align-items:baseline;margin:6px 2px -4px}
.section-h b{font-size:15px}
.link{border:0;background:transparent;color:var(--accent);font-size:13px;cursor:pointer;padding:4px}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;border-radius:14px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:16px;cursor:pointer}
.btn:active{transform:scale(.99);filter:brightness(.95)}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.btn.light{background:var(--surface);color:var(--accent)}
.btn.danger{background:transparent;color:var(--warm);border:1.5px solid var(--warm)}
.btn:focus-visible,.iconbtn:focus-visible,.tabs button:focus-visible,.li:focus-visible,.opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* list rows */
.list{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;padding:14px 14px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;cursor:pointer}
.li:last-child{border-bottom:0}
.li:active{background:var(--keep)}
.li .t{font-weight:600}
.li .s{font-size:12.5px;color:var(--muted);margin-top:1px}
.li .r{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;font-family:var(--mono)}
.li .r svg{width:16px;height:16px}
.badge{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-family:var(--mono);font-weight:600;font-size:13px}
.badge.done{background:var(--accent);color:var(--accent-ink)}

.pill{display:inline-block;font-size:11.5px;font-weight:600;text-align:center;border-radius:999px;padding:3px 10px;white-space:nowrap}
.pill.focus{background:var(--accent);color:var(--accent-ink)}
.pill.boost{background:var(--boost);color:var(--ink)}
.pill.keep{background:var(--keep);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.pill.less{background:transparent;color:var(--muted);box-shadow:inset 0 0 0 1px var(--less)}
.pill.stretch{background:transparent;color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:13.5px;cursor:pointer}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--keep);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:9px;padding:8px 4px;font-size:13.5px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* stats */
.stat .k{font-size:12px;color:var(--muted)}
.hero .stat .k{color:inherit;opacity:.8}
.stat .v{font-family:var(--mono);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
.stat .v span{font-size:14px;font-weight:400;opacity:.75}
.stat .d{font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums;color:var(--warm)}
.stat .d.ok{color:var(--accent)}
.hero .stat .d{color:inherit;opacity:.9}

/* figures */
.sil{display:flex;justify-content:center}
.sil svg{width:100%;max-width:190px;height:auto}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);justify-content:center}
.legend i{display:inline-block;width:16px;height:9px;vertical-align:middle;margin-right:5px;border-radius:2px}
.mapbox{display:flex;justify-content:center}
.mapbox svg{width:100%;max-width:220px;height:auto}
.region{cursor:pointer}
.keyrow{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);justify-content:center}
.keyrow span{display:inline-flex;align-items:center;gap:5px}
.sw{width:11px;height:11px;border-radius:3px;display:inline-block}
.bar{height:5px;border-radius:3px;background:var(--keep);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}

/* options */
.opt{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:14px;cursor:pointer}
.opt[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt .tick{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--less);display:grid;place-items:center}
.opt[aria-checked="true"] .tick{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt .tick svg{width:14px;height:14px}
.opt .s{grid-column:1 / -1;font-size:12.5px;color:var(--muted)}
.ratio{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

/* steps */
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;counter-reset:s}
.steps li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;counter-increment:s}
.steps li::before{content:counter(s);width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-family:var(--mono);font-weight:600;display:grid;place-items:center;font-size:13px}
.note{border-radius:14px;padding:12px 14px;background:var(--warm-soft);font-size:13.5px}
.note.ok{background:var(--accent-soft)}
ul.reasons{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}

/* photo */
.stage{position:relative;border-radius:14px;overflow:hidden;background:var(--keep);touch-action:none;user-select:none}
.stage img{display:block;width:100%;height:auto}
.stage svg.lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.pt{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;border:2px solid #fff;background:var(--accent);color:#fff;font-size:11px;display:grid;place-items:center;cursor:grab;box-shadow:0 1px 4px rgba(0,0,0,.4);touch-action:none}
.drop{display:flex;flex-direction:column;align-items:center;gap:6px;border:1.5px dashed var(--body-line);border-radius:16px;padding:28px 12px;cursor:pointer;text-align:center;background:var(--surface)}
.drop input{position:absolute;opacity:0;width:1px;height:1px}
.drop svg{width:30px;height:30px;color:var(--accent)}
.status{font-size:13px;color:var(--muted)}
.status.err{color:var(--warm)}

/* trace */
.rule{border-left:3px solid var(--line);padding:4px 0 4px 12px}
.rule.on{border-left-color:var(--accent)}
.rule .id{font-family:var(--mono);font-size:12px;color:var(--muted)}
.rule.on .id{color:var(--accent);font-weight:600}
.rule .calc{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

table.tbl{width:100%;border-collapse:collapse;font-size:13px}
table.tbl th,table.tbl td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
table.tbl th{font-size:12px;color:var(--muted);font-weight:600}
.scroll-x{overflow-x:auto}

.empty{text-align:center;padding:28px 12px;display:flex;flex-direction:column;gap:12px;align-items:center}
.empty svg{width:40px;height:40px;color:var(--body-line)}

/* toast + sheet */
.toast{position:absolute;left:50%;bottom:86px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;white-space:nowrap;z-index:30;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.4);z-index:20;display:flex;align-items:flex-end}
.sheet{width:100%;background:var(--surface);border-radius:22px 22px 0 0;padding-block:12px 20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px;animation:up .2s ease-out}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 4px}
@keyframes up{from{transform:translateY(40px)}to{transform:none}}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top" id="top"></header>
  <main class="view" id="view"></main>
  <nav class="tabs" id="tabs" aria-label="主导航"></nav>
</div>

<script>
(function(){
"use strict";
const $ = id => document.getElementById(id);
const f2 = v => (Math.round(v*100)/100).toFixed(2);
const sgn = v => (v>0?'+':v<0?'−':'')+f2(Math.abs(v));

/* ================= icons ================= */
const I = {
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z"/></svg>',
  scan:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><circle cx="12" cy="8.5" r="2"/><path d="M8.5 17c.4-2.5 1.8-4.5 3.5-4.5s3.1 2 3.5 4.5"/></svg>',
  route:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="18" r="2.2"/><circle cx="18" cy="6" r="2.2"/><path d="M8.2 18H15a3 3 0 0 0 0-6H9a3 3 0 0 1 0-6h6.8"/></svg>',
  me:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20c1-3.8 4-6 7.5-6s6.5 2.2 7.5 6"/></svg>',
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  chev:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  camera:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 8h3l1.5-2h7L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',
  info:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.01"/></svg>',
  list:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></svg>'
};

/* ================= data ================= */
const TARGETS = [
  {id:'square',  name:'直角肩薄背', swr:1.45, hwr:1.30, note:'肩线清晰，背部有宽度', who:'想穿吊带、露背装好看；上半身显挺拔', key:'三角肌中束、背阔肌'},
  {id:'peach',   name:'蜜桃线条',   swr:1.34, hwr:1.45, note:'臀部饱满，腰臀差明显', who:'想穿牛仔裤、紧身裤更有曲线', key:'臀中肌、臀大肌'},
  {id:'balanced',name:'均衡薄肌',   swr:1.40, hwr:1.38, note:'上下比例平均', who:'没有特别偏好，想整体匀称', key:'肩、背、臀均衡'},
  {id:'athletic',name:'运动 X 型',  swr:1.50, hwr:1.45, note:'肩和臀都有明显宽度', who:'喜欢运动感，接受更明显的肌肉线条', key:'肩和臀都要加量'},
  {id:'ballet',  name:'纤长芭蕾',   swr:1.30, hwr:1.30, note:'整体线条纤细', who:'偏好纤细、拉长的视觉效果', key:'以体态和臀腿后侧为主'}
];
const SAMPLES = {
  a:{label:'样例 A', tag:'窄肩 + 圆肩', m:{swr:1.22, hwr:1.31, sTilt:0.036, hTilt:0.006}, rounded:true, apt:false},
  b:{label:'样例 B', tag:'臀部偏平 + 骨盆前倾', m:{swr:1.37, hwr:1.17, sTilt:0.008, hTilt:0.034}, rounded:false, apt:true}
};
const EX = {
  lat_raise:{name:'哑铃侧平举',dose:'3–4 组 × 12–20 次',steps:['站直，手肘微屈，哑铃放在身体两侧','手肘带动手臂向两侧抬起，到与肩同高','顶端停 1 秒，用 2–3 秒慢慢放下'],cue:'想象把哑铃往远处推，而不是往上举',avoid:'耸肩、借身体晃动把哑铃甩起来'},
  cable_lat:{name:'绳索单侧侧平举',dose:'3 组 × 12–15 次/侧',steps:['侧身站在绳索旁，远端的手握把手','手臂从身体前方向侧上方抬起','控制回落，做完一侧换另一侧'],cue:'全程保持张力，底部不要完全放松',avoid:'身体跟着向另一侧倾斜'},
  pulldown:{name:'高位下拉',dose:'3–4 组 × 10–12 次',steps:['握距略宽于肩，挺胸坐稳','手肘向下向后拉，横杆拉到锁骨附近','慢慢还原到手臂伸直'],cue:'把手肘往裤兜方向拉',avoid:'身体大幅后仰借力'},
  straight_arm:{name:'直臂下压',dose:'3 组 × 12–15 次',steps:['面对绳索，手臂伸直握杆','髋略前屈，手臂向下压到大腿前侧','慢慢回到头前方'],cue:'手臂像钟摆，只活动肩关节',avoid:'弯肘，变成练手臂后侧'},
  reverse_fly:{name:'反向飞鸟',dose:'3 组 × 15–20 次',steps:['俯身约 45°，背部保持平直','双臂向两侧打开到与身体平齐','顶端夹一下肩胛，慢慢放下'],cue:'重量轻一点，感受后肩发力',avoid:'耸肩，用斜方肌代偿'},
  face_pull:{name:'面拉',dose:'3 组 × 15 次',steps:['绳索与眼睛同高，双手握绳','向脸部方向拉，手肘向外打开','停 1 秒后慢慢还原'],cue:'拉到最后双手在耳朵两侧',avoid:'腰向后仰'},

/* ================= rule engine ================= */
function analyze(m, flags, t){
  const out = {}; const trace = []; const notes = [];
  const raise = (id,lv,why)=>{ const c=out[id]; if(!c){out[id]={level:lv,reasons:[why]};return;}
    if(LV[lv].rank>LV[c.level].rank) c.level=lv; c.reasons.push(why); };
  const lower = (id,why)=>{ const c=out[id]; if(!c){out[id]={level:'less',reasons:[why]};return;}
    if(c.level==='keep') c.level='less'; c.reasons.push(why); };
  const dS = t.swr - m.swr, dH = t.hwr - m.hwr;
  const rule = (id,cond,calc,fired,effect)=>trace.push({id,cond,calc,fired,effect});

  const c1 = `目标 ${f2(t.swr)} − 现在 ${f2(m.swr)} = ${sgn(dS)}`;
  rule('R1a','肩腰比差距 ≥ 0.10',c1,dS>=0.10,'三角肌中束 → 重点；背阔肌 → 加强');
  rule('R1b','0.04 ≤ 肩腰比差距 < 0.10',c1,dS>=0.04&&dS<0.10,'三角肌中束、背阔肌 → 加强');
  rule('R1c','肩腰比差距 ≤ −0.04',c1,dS<=-0.04,'肩已够宽：中束保持，上斜方少分配');
  if(dS>=0.10){
    raise('delt_side','focus',`肩腰比差 ${f2(dS)}。肩部的视觉宽度主要来自三角肌中束，它是缩小差距最直接的肌肉`);
    raise('lats','boost','背阔肌让上背从腋下展开，配合肩宽形成倒三角');
  }else if(dS>=0.04){
    raise('delt_side','boost',`肩腰比差 ${f2(dS)}，适度加量就够`);
    raise('lats','boost','背阔肌让上背从腋下展开');
  }else if(dS<=-0.04){
    raise('delt_side','keep',`肩腰比已比目标高 ${f2(-dS)}，不需要再加宽`);
    lower('traps_up','肩已够宽，避免上斜方继续变厚让肩线变斜');
  }

  const c2 = `目标 ${f2(t.hwr)} − 现在 ${f2(m.hwr)} = ${sgn(dH)}`;
  rule('R2a','臀腰比差距 ≥ 0.10',c2,dH>=0.10,'臀中肌、臀大肌 → 重点');
  rule('R2b','0.04 ≤ 臀腰比差距 < 0.10',c2,dH>=0.04&&dH<0.10,'臀中肌、臀大肌 → 加强');
  rule('R2c','臀腰比差距 ≤ −0.04',c2,dH<=-0.04,'臀部已够宽：臀部训练保持');
  if(dH>=0.10){
    raise('glute_med','focus',`臀腰比差 ${f2(dH)}。髋部外侧的宽度主要来自臀中肌`);
    raise('glute_max','focus','臀大肌决定臀部的饱满度和侧面轮廓');
  }else if(dH>=0.04){
    raise('glute_med','boost',`臀腰比差 ${f2(dH)}，适度加量`);
    raise('glute_max','boost','臀大肌决定臀部的饱满度');
  }else if(dH<=-0.04){
    raise('glute_med','keep',`臀腰比已比目标高 ${f2(-dH)}`);
    raise('glute_max','keep','维持即可');
  }

  rule('R3','圆肩 = 是',flags.rounded?'是':'否',flags.rounded,'后束·中下斜方 → 重点；胸、上斜方 → 少分配');
  if(flags.rounded){
    raise('rear','focus','圆肩：后束和中下斜方负责把肩膀拉回中立位，先纠正再谈加宽');
    lower('pecs','圆肩：推类动作减量，每次练完做胸部拉伸');
    lower('traps_up','圆肩人群上斜方常常代偿发力，不额外加量');
  }

  rule('R4','骨盆前倾 = 是',flags.apt?'是':'否',flags.apt,'臀大肌、腘绳肌、核心 → 至少加强；髋屈肌 → 拉伸');
  if(flags.apt){
    raise('glute_max','boost','骨盆前倾：臀大肌负责把骨盆往后拉正');
    raise('hams','boost','骨盆前倾：腘绳肌和臀大肌一起控制骨盆后倾');
    raise('core','boost','骨盆前倾：腹部负责防止腰椎过度前凸，死虫比卷腹更合适');
    raise('hipflex','stretch','骨盆前倾：髋屈肌通常偏紧，需要拉伸而不是加练');
  }

  const st = m.sTilt||0;
  rule('R5','肩线倾斜 ≥ 3%',`${(st*100).toFixed(1)}%`,st>=0.03,'侧平举改为单侧，从低侧开始');
  if(st>=0.03){
    raise('delt_side', out.delt_side?out.delt_side.level:'keep','高低肩：侧平举改单侧做，从较低一侧开始，组数两侧相同');
    lower('traps_up','高低肩：高侧上斜方常偏紧，不加练，做颈侧拉伸');
  }

  const ht = m.hTilt||0;
  rule('R6','髋线倾斜 ≥ 3%',`${(ht*100).toFixed(1)}%`,ht>=0.03,'臀中肌加入单腿训练');
  if(ht>=0.03){
    raise('glute_med', out.glute_med && LV[out.glute_med.level].rank>=LV.boost.rank ? out.glute_med.level : 'boost','髋线不平：加入单腿臀桥，左右分开练');
  }

  const r7 = t.id==='ballet' && dH<=0;
  rule('R7','目标为纤长芭蕾，且臀腰比已达标',r7?'是':'否',r7,'股四头肌 → 少分配（不是不练）');
  if(r7) lower('quads','目标偏纤长，下肢以臀和腿后侧为主，股四头比例上少分配，但不要停练');

  const r8 = dS>=0.06 && dH>=0.06;
  rule('R8','肩腰比、臀腰比都差 ≥ 0.06',`${sgn(dS)} / ${sgn(dH)}`,r8,'提示：腰围是两个比例共同的分母');
  if(r8) notes.push('两个比例都偏低时，腰围也是原因之一。腰围变化主要靠整体体脂下降，练腹不能局部瘦腰。');

  for(const id in MUSCLES){
    if(id==='hipflex') continue;
    if(!out[id]) out[id]={level:'keep',reasons:[MUSCLES[id].base]};
    else if(id==='quads' && out[id].level!=='less') out[id].reasons.push(MUSCLES.quads.base);
  }

  const ids = Object.keys(out).filter(id=>out[id].level!=='stretch');
  const wsum = ids.reduce((a,id)=>a+LV[out[id].level].w,0);
  ids.forEach(id=>{ out[id].sets = Math.max(1,Math.round(WEEKLY_SETS*LV[out[id].level].w/wsum)); });

  let headline;
  if(Math.max(dS,dH)<0.04) headline='比例已接近目标，重点是维持和纠正体态';
  else if(dS>=dH) headline='主要差在肩部宽度';
  else headline='主要差在臀部外侧';
  if(st>=0.03 || ht>=0.03) notes.push('检测到左右不平：本页只给训练侧重点，如有疼痛或明显不对称，先找康复师评估。');

  return {muscles:out, trace, notes, dS, dH, headline};
}

const target = () => TARGETS.find(x=>x.id===S.target) || TARGETS[0];
const currentM = () => S.mode==='photo' ? S.photoM : SAMPLES[S.mode].m;
function getRes(){ const m=currentM(); return m ? analyze(m,{rounded:S.rounded,apt:S.apt},target()) : null; }
const sourceLabel = () => S.mode==='photo' ? '我的照片' : SAMPLES[S.mode].label+' · '+SAMPLES[S.mode].tag;
const sortedMuscles = res => Object.entries(res.muscles).sort((a,b)=>LV[b[1].level].rank-LV[a[1].level].rank || (b[1].sets||0)-(a[1].sets||0));

function weekPlan(res){
  const days={A:{name:'上肢日',items:[]},B:{name:'下肢日',items:[]},C:{name:'重点 + 核心',items:[]}};
  for(const [id,v] of sortedMuscles(res)){
    const mu=MUSCLES[id];
    if(v.level==='stretch'){ days.B.items.push({id,ex:mu.ex[0],sets:'拉伸',lv:v.level}); days.C.items.push({id,ex:mu.ex[0],sets:'拉伸',lv:v.level}); continue; }
    const grp = UPPER.includes(id)?'A':LOWER.includes(id)?'B':'C';
    if((v.level==='focus'||v.level==='boost') && v.sets>=4 && grp!=='C'){
      const s1=Math.ceil(v.sets/2);
      days[grp].items.push({id,ex:mu.ex[0],sets:s1+' 组',lv:v.level});
      days.C.items.push({id,ex:mu.ex[1]||mu.ex[0],sets:(v.sets-s1)+' 组',lv:v.level});
    }else days[grp].items.push({id,ex:mu.ex[0],sets:v.sets+' 组',lv:v.level});
  }
  return days;
}

/* ================= figures ================= */
function smoothClosed(p){
  const F=v=>v.toFixed(1); const n=p.length; let d=`M${F(p[0][0])},${F(p[0][1])}`;
  for(let i=0;i<n;i++){
    const p0=p[(i-1+n)%n],p1=p[i],p2=p[(i+1)%n],p3=p[(i+2)%n];
    d+=`C${F(p1[0]+(p2[0]-p0[0])/6)},${F(p1[1]+(p2[1]-p0[1])/6)} ${F(p2[0]-(p3[0]-p1[0])/6)},${F(p2[1]-(p3[1]-p1[1])/6)} ${F(p2[0])},${F(p2[1])}`;
  }
  return d+'Z';
}
function bodyPath(cx, halfW, swr, hwr, sOff=0, hOff=0){
  const hS=halfW*swr, hH=halfW*hwr, ua=halfW+(hS-halfW)*0.55;
  const right = (k)=>[
    [9,62,0],[hS*0.6,76,k*sOff*0.6],[hS,92,k*sOff],[hS*0.94,114,k*sOff*0.6],[ua,135,0],[halfW,185,0],
    [hH,232,k*hOff],[hH*0.93,268,k*hOff*0.5],[hH*0.68,330,0],[hH*0.5,372,0],[hH*0.44,410,0],[hH*0.2,414,0],
    [hH*0.17,372,0],[hH*0.16,320,0],[4,280,0]
  ];
  const R = right(1).map(([x,y,o])=>[cx+x,y+o]);
  const L = right(-1).map(([x,y,o])=>[cx-x,y+o]).reverse();
  return smoothClosed(R.concat(L));
}
function silSVG(m,t){
  const W=34, cx=120;
  const sOff=(m.sTilt||0)*W*m.swr*2, hOff=(m.hTilt||0)*W*m.hwr*2;
  const cur=bodyPath(cx,W,m.swr,m.hwr,sOff,hOff), tgt=bodyPath(cx,W,t.swr,t.hwr);
  const arrows=[];
  const mk=(y,from,to,label)=>{
    if(Math.abs(to-from)<1.2) return;
    [1,-1].forEach(k=>{
      const x1=cx+k*from, x2=cx+k*to, dir=Math.sign(x2-x1);
      arrows.push(`<line x1="${x1.toFixed(1)}" y1="${y}" x2="${x2.toFixed(1)}" y2="${y}" style="stroke:var(--warm)" stroke-width="3" stroke-linecap="round"/><path d="M${x2.toFixed(1)},${y} l${(-dir*5).toFixed(1)},-4 l0,8z" style="fill:var(--warm)"/>`);
    });
    arrows.push(`<text x="${(cx+to+6).toFixed(1)}" y="${y+4}" style="fill:var(--warm);font:600 11px var(--mono)">${label}</text>`);
  };
  const dS=t.swr-m.swr, dH=t.hwr-m.hwr;
  if(dS>0) mk(92, W*m.swr, W*t.swr, '肩 '+sgn(dS));
  if(dH>0) mk(232, W*m.hwr, W*t.hwr, '臀 '+sgn(dH));
  return `<svg viewBox="0 0 240 430" role="img" aria-label="现在与目标的轮廓叠加">
    <circle cx="${cx}" cy="40" r="20" style="fill:var(--body)"/>
    <path d="${cur}" style="fill:var(--body);stroke:var(--body-line)" stroke-width="1"/>
    <path d="${tgt}" style="fill:none;stroke:var(--accent)" stroke-width="2" stroke-dasharray="5 4"/>
    <line x1="${cx-W}" y1="185" x2="${cx+W}" y2="185" style="stroke:var(--muted)" stroke-width="1" stroke-dasharray="2 3"/>
    <text x="${cx}" y="200" text-anchor="middle" style="fill:var(--muted);font:11px var(--mono)">腰 = 1.00</text>
    ${arrows.join('')}</svg>`;
}

function regionStyle(lv){

    case 'focus': return 'fill:var(--accent)';
    case 'boost': return 'fill:var(--boost)';
    case 'less': return 'fill:url(#hatch);stroke:var(--less);stroke-width:1';

}
function mapSVG(view,res){
  const base=bodyPath(100,28,1.4,1.38);
  const rs=REGIONS[view].map(([id,type,x,y,a,b,r])=>{
    const mm=res.muscles[id]; if(!mm) return '';
    const attrs=`class="region" data-go="muscle" data-arg="${id}" style="${regionStyle(mm.level)}"`;
    const tt=`<title>${MUSCLES[id].name}：${LV[mm.level].label}</title>`;
    return type==='e' ? `<ellipse ${attrs} cx="${x}" cy="${y}" rx="${a}" ry="${b}" transform="rotate(${r} ${x} ${y})">${tt}</ellipse>`
                      : `<rect ${attrs} x="${x}" y="${y}" width="${a}" height="${b}" rx="${r}">${tt}</rect>`;
  }).join('');
  return `<svg viewBox="0 0 200 430" role="img" aria-label="${view==='front'?'正面':'背面'}肌群图">
    <defs><pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="5" style="stroke:var(--less)" stroke-width="1.4"/></pattern></defs>
    <circle cx="100" cy="40" r="18" style="fill:var(--surface);stroke:var(--body-line)"/>
    <path d="${base}" style="fill:var(--surface);stroke:var(--body-line)" stroke-width="1"/>${rs}</svg>`;
}

/* ================= ui helpers ================= */
const pill = lv => `<span class="pill ${lv}">${LV[lv].label}</span>`;
const li = (o) => `<button class="li" type="button" ${o.go?`data-go="${o.go}"`:''} ${o.arg!=null?`data-arg="${o.arg}"`:''} ${o.act?`data-act="${o.act}"`:''}>
  ${o.lead||'<span></span>'}<span style="min-width:0"><div class="t">${o.t}</div>${o.s?`<div class="s">${o.s}</div>`:''}</span>
  <span class="r">${o.r||''}${o.noChev?'':I.chev}</span></button>`;
const stat = (k,cur,tg,d) => `<div class="stat"><div class="k">${k}</div><div class="v">${f2(cur)} <span>→ ${f2(tg)}</span></div><div class="d ${Math.abs(d)<0.04?'ok':''}">${Math.abs(d)<0.04?'已接近目标':'差距 '+sgn(d)}</div></div>`;
const emptyNoData = () => `<div class="card empty">${I.camera}<h3>还没有你的测量数据</h3><p class="muted small">上传一张正面全身照，或者先用样例看看效果。</p><button class="btn" type="button" data-go="photo">去拍照测量</button><button class="btn ghost" type="button" data-act="useSample">先用样例 A</button></div>`;
const todayKey = () => new Date().toISOString().slice(0,10);
function fmtDate(iso){ const d=new Date(iso); return `${d.getMonth()+1}月${d.getDate()}日 ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }

/* ================= router ================= */
let stack=[{p:'home'}];
function render(dir){
  const cur=stack[stack.length-1]; const pg=PAGES[cur.p];
  const title=typeof pg.title==='function'?pg.title(cur.a):pg.title;
  const lvl=Math.min(stack.length,3);
  $('top').className='top lvl'+lvl;
  $('top').innerHTML = lvl===1
    ? `<h1>${title}</h1><span></span>`
    : `<button class="iconbtn" type="button" data-back="1" aria-label="返回">${I.back}</button><h1>${title}</h1><span></span>`;
  const v=$('view'); v.className='view '+(dir||'fade'); v.innerHTML=pg.render(cur.a); v.scrollTop=0;
  const tab=stack[0].p;
  $('tabs').innerHTML=TABS.map(([id,l,ic])=>`<button type="button" data-tab="${id}" ${tab===id?'aria-current="page"':''}>${ic}<span>${l}</span></button>`).join('');
  if(pg.after) pg.after(cur.a);
}
function go(p,a){ stack.push({p,a}); render('fwd'); }
function back(){ if(stack.length>1){ stack.pop(); render('back'); } }
function tab(id){ stack=[{p:id}]; render('fade'); }
function refresh(){ const v=$('view'); const y=v.scrollTop; render('none'); v.className='view'; v.scrollTop=y; }

function toast(msg){
  const old=document.querySelector('.toast'); if(old) old.remove();
  const el=document.createElement('div'); el.className='toast'; el.setAttribute('role','status'); el.textContent=msg;
  $('app').appendChild(el); setTimeout(()=>el.remove(),1800);
}
function sheet(html){
  const s=document.createElement('div'); s.className='scrim'; s.innerHTML=`<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  s.addEventListener('click',e=>{ if(e.target===s||e.target.closest('[data-close]')) s.remove(); });
  $('app').appendChild(s); return s;
}

/* ================= actions ================= */
const ACT = {
  useSample(){ S.mode='a'; S.rounded=SAMPLES.a.rounded; S.apt=SAMPLES.a.apt; save(); refresh(); },
  setMode(a){ S.mode=a; if(a!=='photo'){ S.rounded=SAMPLES[a].rounded; S.apt=SAMPLES[a].apt; } save(); refresh(); if(a==='photo'&&!S.photoM) go('photo'); },
  toggle(a){ S[a]=!S[a]; save(); refresh(); },
  chooseTarget(a){ S.target=a; save(); toast('已设为目标：'+target().name); back(); },
  generate(){
    const m=currentM(); if(!m) return;
    const res=getRes();
    S.history.unshift({t:new Date().toISOString(), src:S.mode==='photo'?'我的照片':SAMPLES[S.mode].label, mode:S.mode, m, rounded:S.rounded, apt:S.apt, target:S.target, targetName:target().name});
    S.history=S.history.slice(0,20); save();
    tab('plan'); toast(res.headline);
  },
  mapView(a){ T.mapView=a; refresh(); },
  day(a){ T.day=a; refresh(); },
  toggleDone(a){ const k=todayKey()+a; if(S.done[k]) delete S.done[k]; else S.done[k]=1; save(); refresh(); if(S.done[k]) toast('已记录，继续加油'); },
  loadHistory(i){ const h=S.history[+i]; if(!h) return; S.mode=h.mode; if(h.mode==='photo') S.photoM=h.m; S.rounded=h.rounded; S.apt=h.apt; S.target=h.target; save(); tab('home'); toast('已载入 '+fmtDate(h.t)+' 的记录'); },
  askReset(){
    const s=sheet(`<div class="grab"></div><h3>清除本机数据？</h3><p class="muted small">会删除测量记录、照片测量结果和训练打卡，无法恢复。</p><button class="btn danger" type="button" id="doReset">清除</button><button class="btn ghost" type="button" data-close="1">取消</button>`);
    s.querySelector('#doReset').addEventListener('click',()=>{ S.history=[]; S.done={}; S.photoM=null; S.mode='a'; S.target='square'; S.rounded=true; S.apt=false; save(); s.remove(); tab('me'); toast('已清除'); });
  },
  usePhoto(){ if(!T.photoM){ toast('先放好 6 个点'); return; } S.photoM=T.photoM; S.mode='photo'; save(); toast('已使用照片数据'); stack=[{p:'measure'}]; render('back'); },
  rePhoto(){ T.photoURL=null; T.photoPts=null; T.photoM=null; refresh(); },
  autoDetect: autoDetect
};

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-go],[data-tab],[data-act],[data-back]'); if(!el || el.disabled) return;
  if(el.closest('.sheet') && !el.dataset.act) return;
  if(el.dataset.back){ back(); return; }
  if(el.dataset.tab){ tab(el.dataset.tab); return; }
  if(el.dataset.act){ const f=ACT[el.dataset.act]; if(f) f(el.dataset.arg); return; }
  if(el.dataset.go){ if(PAGES[el.dataset.go].lvl===1) tab(el.dataset.go); else go(el.dataset.go, el.dataset.arg); }
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ const s=document.querySelector('.scrim'); if(s) s.remove(); else back(); } });

/* ================= photo ================= */
const PT_LABELS={sl:'肩',sr:'肩',wl:'腰',wr:'腰',hl:'臀',hr:'臀'};
const defaultPts=()=>({sl:[.32,.25],sr:[.68,.25],wl:[.41,.44],wr:[.59,.44],hl:[.36,.53],hr:[.64,.53]});
function measureFromPts(p){
  const img=$('photo'); const ar=(img&&img.naturalHeight||1)/(img&&img.naturalWidth||1);
  const w=(a,b)=>Math.abs(p[b][0]-p[a][0]);
  const sw=w('sl','sr'), ww=w('wl','wr'), hw=w('hl','hr');
  if(ww<0.02||sw<0.02||hw<0.02) return null;
  const tilt=(a,b,width)=>Math.abs((p[a][1]-p[b][1])*ar)/width;
  return {swr:sw/ww, hwr:hw/ww, sTilt:tilt('sl','sr',sw), hTilt:tilt('hl','hr',hw)};
}
function drawLines(){
  const p=T.photoPts; if(!p||!$('lines')) return;
  const L=(a,b)=>`<line x1="${p[a][0]*100}" y1="${p[a][1]*100}" x2="${p[b][0]*100}" y2="${p[b][1]*100}" stroke="white" vector-effect="non-scaling-stroke" style="stroke-width:2px"/>`;
  $('lines').innerHTML=L('sl','sr')+L('wl','wr')+L('hl','hr');
}
function drawPts(){
  const st=$('stage'); if(!st) return; st.querySelectorAll('.pt').forEach(n=>n.remove());
  const p=T.photoPts;
  for(const k in p){
    const d=document.createElement('div'); d.className='pt'; d.dataset.k=k; d.textContent=PT_LABELS[k];
    d.style.left=(p[k][0]*100)+'%'; d.style.top=(p[k][1]*100)+'%';
    d.setAttribute('aria-label',PT_LABELS[k]+(k.endsWith('l')?'（左）':'（右）'));
    d.addEventListener('pointerdown',startDrag); st.appendChild(d);
  }
  drawLines();
}
function updatePhotoM(){
  const m=measureFromPts(T.photoPts); T.photoM=m;
  const s=$('photoStatus'); if(!s) return;
  s.className='status'+(m?'':' err');
  s.textContent = m ? `肩腰比 ${f2(m.swr)} · 臀腰比 ${f2(m.hwr)}。拖动圆点可以微调。` : '两点距离太近，算不出比例。请把左右两个点拉开。';
}
let drag=null;
function startDrag(e){
  e.preventDefault(); drag=e.currentTarget.dataset.k; e.currentTarget.setPointerCapture(e.pointerId);
  e.currentTarget.addEventListener('pointermove',onDrag);
  e.currentTarget.addEventListener('pointerup',ev=>{ ev.currentTarget.removeEventListener('pointermove',onDrag); drag=null; },{once:true});
}
function onDrag(e){
  if(!drag) return; const r=$('stage').getBoundingClientRect();
  const x=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)), y=Math.min(1,Math.max(0,(e.clientY-r.top)/r.height));
  T.photoPts[drag]=[x,y]; e.currentTarget.style.left=(x*100)+'%'; e.currentTarget.style.top=(y*100)+'%';
  drawLines(); updatePhotoM();
}
function setupPhoto(){
  const f=$('file');
  if(f) f.addEventListener('change',e=>{
    const file=e.target.files&&e.target.files[0]; if(!file) return;
    if(T.photoURL) URL.revokeObjectURL(T.photoURL);
    T.photoURL=URL.createObjectURL(file); T.photoPts=defaultPts();
    $('drop').hidden=true; $('photoArea').hidden=false; $('photoBtns').hidden=false;
    const img=$('photo');
    img.onload=()=>{ drawPts(); updatePhotoM(); };
    img.onerror=()=>{ const s=$('photoStatus'); s.className='status err'; s.textContent='这张图片打不开，请换一张 JPG 或 PNG。'; };
    img.src=T.photoURL;
  });
  if(T.photoURL){ const img=$('photo'); const run=()=>{ drawPts(); updatePhotoM(); }; if(img.complete) run(); else img.onload=run; }
}
const MP='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
let landmarker=null;
async function getLandmarker(){
  if(landmarker) return landmarker;
  const v=await import(MP+'/vision_bundle.mjs');
  const fs=await v.FilesetResolver.forVisionTasks(MP+'/wasm');
  landmarker=await v.PoseLandmarker.createFromOptions(fs,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task'},runningMode:'IMAGE',numPoses:1});
  return landmarker;
}
async function autoDetect(){
  const st=$('photoStatus'); st.className='status'; st.textContent='正在加载识别模型…';
  try{
    const lm=await Promise.race([getLandmarker(), new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),15000))]);
    const r=lm.detect($('photo')); const L=r.landmarks&&r.landmarks[0];
    if(!L) throw new Error('nopose');
    const sh=[L[11],L[12]].sort((a,b)=>a.x-b.x), hp=[L[23],L[24]].sort((a,b)=>a.x-b.x);
    const sj=sh[1].x-sh[0].x, hj=hp[1].x-hp[0].x, hy=(hp[0].y+hp[1].y)/2, sy=(sh[0].y+sh[1].y)/2;
    const hcx=(hp[0].x+hp[1].x)/2, wy=sy+(hy-sy)*0.68, whalf=hj*0.62;
    T.photoPts={sl:[sh[0].x-sj*0.12,sh[0].y],sr:[sh[1].x+sj*0.12,sh[1].y],wl:[hcx-whalf,wy],wr:[hcx+whalf,wy],hl:[hp[0].x-hj*0.38,hp[0].y],hr:[hp[1].x+hj*0.38,hp[1].y]};
    drawPts(); updatePhotoM();
    st.textContent='已自动放好关键点。腰和臀是估算位置，请拖到实际最细、最宽处。';
  }catch(err){
    st.className='status err';
    st.textContent = err.message==='nopose' ? '没有识别到人体，换一张全身正面照试试，或手动拖动 6 个点。' : '当前环境加载不了识别模型，请手动拖动 6 个点。';
  }
}

render('fade');
})();
</script>

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>薄肌比例导航</title>
<meta name="description" content="手动输入尺寸或拍一张正面照，算出身材比例和目标的差距，生成每周训练计划。">
<!-- 主屏 App（PWA）：iPhone 用 Safari 打开 → 分享 → 添加到主屏幕 -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f6f7f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d100f" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="薄肌导航">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<style>
/* Layout: one-column phone shell. Home = tailor's fitting-card figure with tape lines, one thesis line, four numbers, today. Everything else is one tap deeper. */
:root{
  --desk:#e9ebe9; --bg:#f6f7f5; --surface:#ffffff; --ink:#121514; --muted:#6c7370; --faint:#a4aba8; --line:#e5e8e6;
  --accent:#0e6b62; --accent-soft:#e4f0ed; --warm:#b4531b; --warm-soft:#f8ebe2; --body:#dfe3e1; --inert:#ebeeec; --under:#3a6cae; --invert:#ffffff;
  --num:"Instrument Serif","Songti SC",Georgia,serif;
  --text:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --desk:#070908; --bg:#0d100f; --surface:#151918; --ink:#eef2f0; --muted:#97a19d; --faint:#5f6966; --line:#232927;
  --accent:#5cc2b4; --accent-soft:#16302c; --warm:#ee9a5a; --warm-soft:#33241a; --body:#2a302e; --inert:#1f2524; --under:#7ea8e2; --invert:#0d100f; color-scheme:dark}}
:root[data-theme="dark"]{
  --desk:#070908; --bg:#0d100f; --surface:#151918; --ink:#eef2f0; --muted:#97a19d; --faint:#5f6966; --line:#232927;
  --accent:#5cc2b4; --accent-soft:#16302c; --warm:#ee9a5a; --warm-soft:#33241a; --body:#2a302e; --inert:#1f2524; --under:#7ea8e2; --invert:#0d100f; color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--desk);color:var(--ink);font-family:var(--text);font-size:15px;line-height:1.55;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
p,h1,h2,h3{margin:0}
[hidden]{display:none!important}
.app{position:relative;height:100%;max-width:440px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
@media (max-width:599px){body{background:var(--bg)}} /* 手机上底色和 App 一致（状态栏、Home 条两侧不露出桌面灰） */
@media (min-width:600px){.app{height:calc(100% - 48px);max-height:900px;margin-top:24px;border-radius:36px;box-shadow:0 30px 80px rgba(0,0,0,.14),0 0 0 1px var(--line)}}

/* top bar */
.top{flex:none;display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;height:54px;padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px))}
.top h1{text-align:center;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top.root{grid-template-columns:minmax(0,1fr) auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.top.root h1{text-align:left;font-size:13px;font-weight:500;color:var(--muted);letter-spacing:.02em}
.top .aside{font:500 12px var(--mono);color:var(--faint)}
.iconbtn{width:40px;height:40px;border:0;background:transparent;border-radius:12px;display:grid;place-items:center;cursor:pointer}
.iconbtn svg{width:22px;height:22px}

.view{flex:1;overflow-y:auto;overscroll-behavior:contain;padding-block:0 40px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:28px}
.view>*{flex-shrink:0}
.view.fwd{animation:inR .26s cubic-bezier(.2,.8,.2,1)}.view.back{animation:inL .26s cubic-bezier(.2,.8,.2,1)}
@keyframes inR{from{transform:translateX(18px);opacity:0}to{transform:none;opacity:1}}
@keyframes inL{from{transform:translateX(-18px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.view,.sheet,.fade{animation:none!important}}

.tabs{flex:none;display:grid;grid-template-columns:repeat(3,1fr);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:2px}
.tabs button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 10px;font-size:11px;color:var(--faint);cursor:pointer}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-current="page"]{color:var(--ink)}

/* type */
.eyebrow{font:500 11px/1.4 var(--mono);color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.h1{font-size:26px;line-height:1.25;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
.h2{font-size:19px;line-height:1.35;font-weight:600;text-wrap:balance}
.num{font-family:var(--num);font-weight:400;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.xs{font-size:12px}
.warm{color:var(--warm)}
.acc{color:var(--accent)}
.stack{display:flex;flex-direction:column;gap:10px}
.row2{display:flex;gap:10px;align-items:center}
.between{display:flex;justify-content:space-between;align-items:baseline;gap:12px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 22px;border-radius:999px;border:0;background:var(--ink);color:var(--invert);font-weight:600;font-size:15px;cursor:pointer;transition:transform .12s}
.btn:active{transform:scale(.98)}
.btn.block{width:100%}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn.acc{background:var(--accent);color:#fff}
.btn svg{width:18px;height:18px}
.link{border:0;background:none;padding:6px 0;color:var(--accent);font-weight:500;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.link svg{width:15px;height:15px}
.linkbtn{border:0;background:none;color:var(--muted);font-size:13px;padding:6px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
button:focus-visible,input:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* list rows: hairlines, no boxes */
.list{border-top:1px solid var(--line)}
.li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;width:100%;padding:15px 2px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;cursor:pointer}
.li:disabled{cursor:default}
.li .t{display:block;font-weight:500}
.li .s{display:block;font-size:13px;color:var(--muted);margin-top:1px}
.li .r{display:flex;align-items:center;gap:6px;color:var(--faint);font-size:13px}
.li .r svg{width:16px;height:16px}
.idx{width:26px;font:500 13px var(--mono);color:var(--faint);text-align:left}
.idx.done{color:var(--accent)}
.idx svg{width:16px;height:16px}
.thumb{width:52px;height:40px;border-radius:9px;object-fit:cover;background:var(--line);filter:grayscale(1) contrast(1.05)}

/* fitting-card figure */
.hero{display:flex;flex-direction:column;gap:6px;margin:0 -8px}
.herobar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:0 8px}
.seg.sm button{padding:5px 12px;font-size:12.5px}
#figHost svg{display:block;width:100%;height:auto;max-height:64vh}
#fig .m{fill:var(--body);transition:fill .35s ease}
#fig .inert{fill:var(--inert)}
#fig .m.hl{fill:color-mix(in srgb,var(--st) 26%,var(--body))}
#fig .m.hl.focus{fill:color-mix(in srgb,var(--st) 55%,var(--body))}
#fig .meas{transition:opacity .25s;cursor:pointer}
#fig .meas line,#fig .meas path{stroke:var(--st);fill:none}
#fig .meas .tape{stroke-width:2.4}
#fig .meas .tick{stroke-width:1.4;opacity:.7}
#fig .meas .lead{stroke-width:1.2;stroke-dasharray:3 5;opacity:.75}
#fig .meas circle{fill:var(--st)}
#fig .meas text{font-family:var(--text);font-size:40px;font-weight:500;fill:var(--ink)}
#fig .meas .val{font-family:var(--mono);font-size:36px;fill:var(--muted)}
#fig .meas .dl{font-family:var(--mono);font-size:36px;font-weight:500;fill:var(--st)}
#fig.dim .meas:not(.focus){opacity:.28}
#fig.dim .m.hl:not(.focus){fill:color-mix(in srgb,var(--st) 12%,var(--body))}
.figkey{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);padding:0 8px}
.figkey i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* 3D body */
.body3d{position:relative;height:clamp(300px,50vh,470px);touch-action:pan-y;cursor:grab;-webkit-user-select:none;user-select:none;overflow:hidden}
.body3d.grab{cursor:grabbing}
.body3d canvas{display:block;width:100%;height:100%}
.body3d.flat{height:auto;cursor:auto}
.b3load{position:absolute;inset:auto 0 46% 0;text-align:center}
.body3d canvas~.b3load,.body3d.flat .b3load{display:none}
.tags3{position:absolute;inset:0;pointer-events:none}
.tag3{position:absolute;right:6px;transform:translateY(-50%);pointer-events:auto;display:flex;align-items:baseline;gap:5px;border:0;background:color-mix(in srgb,var(--bg) 82%,transparent);padding:3px 6px;border-radius:6px;font-size:11.5px;color:var(--ink);cursor:pointer;transition:opacity .25s}
.tag3 i{position:absolute;right:100%;top:50%;width:var(--lead,20px);border-top:1px dashed var(--st);opacity:.8}
.tag3 i::before{content:"";position:absolute;left:-3px;top:-3.5px;width:6px;height:6px;border-radius:50%;background:var(--st)}
.tag3 b{font-weight:500;color:var(--muted)}
.tag3 em{font-style:normal;font-weight:500;color:var(--st)}
.tag3.dim{opacity:.3}
.mpanel{padding:4px 8px 0;display:flex;flex-direction:column;gap:8px}
.mp-hint{font-size:12px;color:var(--muted);text-align:center;margin:0}
.mp-head{display:flex;align-items:flex-start;gap:8px}
.mp-head>div{flex:1;min-width:0}
.mp-head .badge{margin:6px 0 0}
.mp-x{border:0;background:none;color:var(--muted);width:32px;height:32px;display:grid;place-items:center;margin:-2px -6px 0 0;cursor:pointer;border-radius:8px}
.mp-x svg{width:16px;height:16px}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:14px 0 12px}
.metric{display:flex;flex-direction:column;gap:2px;border:0;background:none;text-align:left;padding:0 6px;cursor:pointer;border-left:1px solid var(--line)}
.metric:first-child{border-left:0;padding-left:2px}
.metric .num{font-size:28px;line-height:1}
.metric .num small{font:500 11px var(--mono);color:var(--muted);margin-left:2px}
.metric .k{font-size:12px;color:var(--muted)}
.metric .d{font:500 11px var(--mono)}
.metric[aria-pressed="true"] .k{color:var(--ink);font-weight:600}

.ratio{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:4px 12px;align-items:center}
.track{position:relative;height:2px;background:var(--line)}
.track .fill{position:absolute;left:0;top:0;bottom:0;background:var(--ink)}
.track .tgt{position:absolute;top:-6px;bottom:-6px;border-left:1.5px dashed var(--accent)}
.track .dot{position:absolute;top:50%;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%;background:var(--ink)}

.today{display:flex;flex-direction:column;gap:14px;padding:18px;border-radius:var(--r);background:var(--surface);box-shadow:0 0 0 1px var(--line)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.week button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:6px;padding:4px 0;font-size:11px;color:var(--faint);cursor:pointer}
.week .dd{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font:500 12px var(--mono);color:var(--muted)}
.week .train .dd{color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.week .done .dd{background:var(--accent);color:#fff;box-shadow:none}
.week .done .dd svg{width:14px;height:14px}
.week .sel .dd{box-shadow:inset 0 0 0 1.5px var(--ink)}
.week .sel{color:var(--ink)}
.week .today-mark{width:4px;height:4px;border-radius:50%;background:var(--warm)}

/* segmented */
.seg{display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--line);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:999px;padding:7px 14px;font-size:13px;cursor:pointer;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}

/* options & switches */
.opt{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;width:100%;padding:14px 2px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;cursor:pointer}
.opt svg.mini{width:30px;height:56px}
.radio{width:20px;height:20px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--faint);display:grid;place-items:center}
.opt[aria-checked="true"] .radio{background:var(--ink);box-shadow:none;color:var(--invert)}
.radio svg{width:12px;height:12px}
.switch{width:44px;height:26px;border-radius:13px;background:var(--line);position:relative;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
[aria-checked="true"] .switch{background:var(--accent)}
[aria-checked="true"] .switch::after{transform:translateX(18px)}

/* measure */
.mtabs{display:grid;grid-template-columns:1fr 1fr;width:100%}
.mtabs button{padding:9px 14px;font-size:14px}
.mfields{display:grid;grid-template-columns:1fr 1fr;gap:20px 18px}
.mf{display:flex;flex-direction:column;gap:2px;min-width:0}
.mf .t{font-size:13px;font-weight:600}
.mf .t em{font:500 10px var(--mono);font-style:normal;color:var(--faint);margin-left:6px;letter-spacing:.04em}
.mf .field input{font-size:36px;width:100%;min-width:0}
.mf .field input::placeholder{color:var(--faint)}
.mf .xs{line-height:1.45;margin-top:4px}
.gaps{border-top:1px solid var(--line)}
.gap{display:grid;grid-template-columns:3.2em minmax(0,1fr) auto;gap:2px 10px;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--line)}
.gap .k{font-size:13px;font-weight:600}
.gap .v{font-size:13px;color:var(--muted)}
.gap .v b{color:var(--ink);font-weight:500}
.gap .d{font-size:13px;font-weight:500;text-align:right}
.gap .d.warm{color:var(--warm)} .gap .d.acc{color:var(--accent)} .gap .d.under{color:var(--under)}
.gap .w{grid-column:2/4}
.field{display:flex;align-items:baseline;gap:8px;border-bottom:1px solid var(--line);padding:6px 0}
.field input{border:0;background:none;font-family:var(--num);font-size:56px;line-height:1.1;width:3.2ch;padding:0;outline:none}
.field span{font:500 13px var(--mono);color:var(--muted)}
.drop{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:220px;border-radius:var(--r);background:var(--surface);box-shadow:0 0 0 1px var(--line);padding:24px 16px;cursor:pointer;text-align:center}
.drop input{position:absolute;opacity:0;width:1px;height:1px}
.drop svg.pose{width:64px;height:120px;color:var(--faint)}
.stage{position:relative;border-radius:14px;overflow:hidden;background:var(--line);touch-action:none;user-select:none}
.stage img{display:block;width:100%;height:auto}
.stage svg.ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.pt{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;touch-action:none;cursor:grab;outline:none}
.pt::before{content:"";position:absolute;left:50%;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px #fff,0 1px 4px rgba(0,0,0,.5)}
.pt.h::before{width:18px;height:8px;margin:-4px 0 0 -9px;border-radius:4px}
.pt.on::before{width:6px;height:6px;margin:-3px 0 0 -3px;box-shadow:0 0 0 1.5px #fff}
.pt:focus-visible::before{box-shadow:0 0 0 2px #fff,0 0 0 5px var(--accent)}
.pt b{position:absolute;left:50%;bottom:31px;transform:translateX(-50%);font:500 10px/1 var(--text);padding:3px 5px;border-radius:5px;background:rgba(0,0,0,.55);color:#fff;white-space:nowrap;pointer-events:none}
.pt.on b{opacity:0}
.loupe{position:absolute;top:10px;width:132px;height:132px;border-radius:50%;border:2px solid #fff;box-shadow:0 4px 16px rgba(0,0,0,.45);pointer-events:none;overflow:hidden;background:#000;z-index:3}
.loupe canvas{display:block;width:100%;height:100%}
.status{font-size:13px;color:var(--muted);min-height:20px}
.status.err{color:var(--warm)}
.readout{display:grid;grid-template-columns:repeat(2,1fr);gap:14px 18px}
.readout div{display:flex;flex-direction:column}
.readout .num{font-size:30px;line-height:1.05}
.readout .k{font-size:12px;color:var(--muted)}
.est{font:500 10px var(--mono);color:var(--warm);margin-left:4px;letter-spacing:.04em}

/* exercise page */
.media{position:relative;margin:0 -20px;aspect-ratio:3/2;max-width:calc(100% + 40px);background:var(--line);overflow:hidden}
.media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.06) brightness(1.04);transition:opacity .5s}
.media .ph{position:absolute;left:20px;bottom:12px;display:flex;gap:6px}
.media .ph button{border:0;border-radius:999px;padding:4px 10px;font:500 11px var(--mono);background:rgba(255,255,255,.85);color:#121514;cursor:pointer}
.media .ph button[aria-pressed="true"]{background:#121514;color:#fff}
.media .credit{position:absolute;right:12px;bottom:12px;font:500 9.5px var(--mono);color:rgba(255,255,255,.85)}
.muscles{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:end}
.muscles svg{width:100%;height:auto;max-height:260px}
.mkey{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.mkey i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
ol.how{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px;counter-reset:s}
ol.how li{display:grid;grid-template-columns:26px minmax(0,1fr);gap:8px;counter-increment:s}
ol.how li::before{content:counter(s,decimal-leading-zero);font:500 12px/1.9 var(--mono);color:var(--faint)}
.callout{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.callout .k{font:500 11px/1.9 var(--mono);letter-spacing:.06em;color:var(--muted)}
.callout.avoid .k{color:var(--warm)}
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--warm-soft)}
.note p{flex:1;min-width:0;font-size:14.5px}
.note small{display:block;font:500 11px var(--mono);color:var(--muted);margin-top:2px}
.note button{border:0;background:none;color:var(--muted);cursor:pointer;padding:2px;width:28px;height:28px;display:grid;place-items:center}
.note button svg{width:15px;height:15px}
.composer{display:flex;gap:8px;align-items:flex-end;border-bottom:1px solid var(--line);padding:4px 0}
.composer textarea{flex:1;min-width:0;border:0;background:none;resize:none;padding:10px 0;font-size:15px;line-height:1.5;outline:none;max-height:120px}
.composer button{flex:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip2{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;color:var(--ink)}
.chip2[aria-pressed="true"]{border-color:var(--ink);font-weight:600}
.badge{display:inline-block;font:500 10.5px var(--mono);padding:1px 7px;border-radius:999px;background:var(--warm-soft);color:var(--warm);margin-left:6px;vertical-align:1px}
.badge.acc{background:var(--accent-soft);color:var(--accent)}
.nextup{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;margin-top:10px;padding:14px 16px;border:0;border-radius:14px;background:var(--accent-soft);color:var(--ink);text-align:left;cursor:pointer}
.nextup>span{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left}
.nextup svg{width:18px;height:18px;flex:none;color:var(--accent)}
.toast{position:absolute;left:50%;bottom:86px;transform:translateX(-50%);background:var(--ink);color:var(--invert);padding:10px 16px;border-radius:999px;font-size:13.5px;white-space:nowrap;z-index:30;animation:fadeup .2s ease-out}
@keyframes fadeup{from{opacity:0;transform:translate(-50%,6px)}to{opacity:1;transform:translate(-50%,0)}}
.credits{font-size:12px;color:var(--faint);line-height:1.6}
.credits a{color:inherit}

/* coach session (dark, immersive) */
.app.immersive .top,.app.immersive .tabs{display:none}
.app.immersive .view{padding:0;gap:0;overflow:hidden}
.sess{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;background:var(--bg)}
.cam{position:relative;flex:1 1 55%;min-height:220px;background:#0b0f0e;overflow:hidden}
.cam video,.cam canvas{position:absolute;inset:0;width:100%;height:100%;transform:scaleX(-1)}
.cam video{object-fit:cover}
.camtop{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding-top:12px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));z-index:3}
.camtop button{width:40px;height:40px;border-radius:50%;border:0;background:rgba(0,0,0,.45);color:#fff;display:grid;place-items:center;cursor:pointer}
.camtop svg{width:20px;height:20px}
.chip{background:rgba(0,0,0,.5);color:#fff;font-size:12.5px;padding:6px 12px;border-radius:999px;display:inline-flex;align-items:center;gap:6px}
.chip i{width:7px;height:7px;border-radius:50%;background:#9aa6a3}
.chip.live i{background:#4ade80}
.chip.warn i{background:#f0a347}
.bigcount{position:absolute;left:max(18px,env(safe-area-inset-left,0px));bottom:12px;color:#fff;font-family:var(--num);font-size:76px;line-height:1;text-shadow:0 2px 14px rgba(0,0,0,.5);z-index:2;transition:transform .12s}
.bigcount small{font:400 16px var(--mono);opacity:.85;margin-left:8px}
.bigcount.pop{transform:scale(1.14)}
.camfb{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;padding:64px 28px 100px;color:#e7eeec;text-align:center;font-size:13.5px;line-height:1.6;z-index:1}
.camfb b{font-size:16px}
.camfb .ok{font-size:64px;line-height:1}
.panel{flex:0 0 auto;padding-block:16px 18px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px}
.cue{border-radius:14px;padding:11px 14px;font-size:14.5px;background:var(--accent-soft);min-height:44px}
.cue.bad{background:var(--warm-soft);color:var(--warm);font-weight:600}
.cue.mine{background:var(--warm-soft)}
.nextup{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.nextup b{color:var(--ink);text-align:right;font-weight:500}
.pdots{display:flex;gap:4px}
.pdots i{flex:1;height:2px;border-radius:1px;background:var(--line)}
.pdots i.on{background:var(--accent)}
.pdots i.cur{background:var(--ink)}
.ctrl{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:8px}
.ctrl .btn{min-height:48px;font-size:14.5px;padding:0 8px}
.big{font-size:22px;font-weight:600;line-height:1.3}
.label{font:500 11px var(--mono);letter-spacing:.06em;color:var(--muted)}
</style>
</head>

function derive(raw,h,legR){

  const waistD=d('waist'), hipD=d('hip'), thighD=d('thigh');
  const cm={shoulder:raw.shoulderW,waistW:raw.waistW,hipW:raw.hipW,thighW:raw.thighW,waistD,hipD,thighD,
    waist:ellipse(raw.waistW,waistD),hip:ellipse(raw.hipW,hipD),thigh:ellipse(raw.thighW,thighD)};

function smooth(p){

  return d+'Z';
}

/* ---------------- 3D 人体：网格与拟合 ----------------
   body.mesh.wasm = MakeHuman 女性基础网格（MPFB2，CC0）+ 4 个测量形变（肩宽/腰围/臀围/腿围）+ 每个顶点在 MuscleMap 正/背面图上的坐标。
   按你的测量值用平面截面求周长，反推每个形变的强度，再整体缩放到你的身高。 */
const REGIONS=['','pecs','delts','biceps','triceps','abs','obliques','traps','lats','lowback','gmax','gmed','quads','hams','adductors','calves'];
const MESH={d:null,p:null,fit:{}};
function meshParse(buf){
  const dv=new DataView(buf); if(dv.getUint32(0,true)!==0x324d4e42) throw new Error('bad mesh');
  const nv=dv.getUint32(4,true), nt=dv.getUint32(8,true), nm=dv.getUint32(12,true); let o=16;
  const q=new Int16Array(buf,o,nv*3); o+=nv*6; const base=new Float32Array(nv*3); for(let i=0;i<q.length;i++) base[i]=q[i]/16384;
  const D=[]; for(let m=0;m<nm;m++){ const a=new Int16Array(buf,o,nv*3); o+=nv*6; const f=new Float32Array(nv*3); for(let i=0;i<a.length;i++) f[i]=a[i]/65536; D.push(f); }
  const idx=new Uint16Array(buf,o,nt*3); o+=nt*6;
  const q2=new Int16Array(buf,o,nv*3); o+=nv*6; const sv=new Float32Array(nv*3); for(let i=0;i<q2.length;i++) sv[i]=q2[i]/4;

function meshLoad(){
  if(MESH.p) return MESH.p;
  return MESH.p=fetch('body.mesh.wasm').then(r=>{ if(!r.ok) throw new Error('mesh '+r.status); return r.arrayBuffer(); })
    .then(b=>MESH.d=meshParse(b)).catch(e=>{ MESH.p=null; throw e; });
}
function morphed(M,w){ const X=new Float32Array(M.base); M.D.forEach((d,m)=>{ const k=w[m]; if(k) for(let i=0;i<X.length;i++) X[i]+=d[i]*k; }); return X; }
// 平面 y 与三角形的交点（只取 parts 位掩码里的部件），返回 xz 凸包——等于软尺绕一圈
function section(M,X,y,parts){
  const I=M.idx, P=M.part, pts=[];
  const cut=(a,b)=>{ const ya=X[a*3+1]-y, yb=X[b*3+1]-y; if((ya<0)!==(yb<0)){ const t=ya/(ya-yb); pts.push([X[a*3]+(X[b*3]-X[a*3])*t, X[a*3+2]+(X[b*3+2]-X[a*3+2])*t]); } };
  for(let f=0;f<I.length;f+=3){ const a=I[f],b=I[f+1],c=I[f+2]; if(!((parts>>P[a])&1)) continue; cut(a,b); cut(b,c); cut(c,a); }
  return hull(pts);
}
function hull(p){
  if(p.length<3) return p; p.sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
  const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]); const lo=[],up=[];
  for(const q of p){ while(lo.length>1&&cr(lo[lo.length-2],lo[lo.length-1],q)<=0) lo.pop(); lo.push(q); }
  for(let i=p.length-1;i>=0;i--){ const q=p[i]; while(up.length>1&&cr(up[up.length-2],up[up.length-1],q)<=0) up.pop(); up.push(q); }
  lo.pop(); up.pop(); return lo.concat(up);
}
const perim=h=>{ let s=0; for(let i=0;i<h.length;i++){ const a=h[i],b=h[(i+1)%h.length]; s+=Math.hypot(a[0]-b[0],a[1]-b[1]); } return s; };
const PT={torso:1,arms:2,legL:4,legR:8};
function measureX(M,X){
  let H=0; for(let i=1;i<X.length;i+=3) if(X[i]>H) H=X[i];
  let a=1e9,b=-1e9; for(let j=0;j<M.nv;j++){ if(M.part[j]>1) continue; const y=X[j*3+1]/H; if(Math.abs(y-.81)<.008){ const x=X[j*3]; if(x<a) a=x; if(x>b) b=x; } }
  let waist=1e9,wy=0,hip=0,hy=0;
  for(let h=.58;h<.665;h+=.01){ const p=perim(section(M,X,h*H,PT.torso)); if(p<waist){ waist=p; wy=h; } }
  for(let h=.47;h<.545;h+=.01){ const p=perim(section(M,X,h*H,PT.torso|PT.legL|PT.legR)); if(p>hip){ hip=p; hy=h; } }
  return {H,shoulder:b-a,waist,hip,thigh:perim(section(M,X,.44*H,PT.legL)),y:{shoulder:.81,waist:wy,hip:hy,thigh:.44}};
}
const MKEYS=['shoulder','waist','hip','thigh'];
// goal: 实际尺寸（米）{h,shoulder,waist,hip,thigh}；返回形变强度、网格坐标、缩放
function fitBody(M,goal){
  const id=MKEYS.map(k=>goal[k].toFixed(4)).join()+goal.h; if(MESH.fit[id]) return MESH.fit[id];
  const w=[.5,.5,.5,.5];
  const sl=MKEYS.map((k,i)=>{ const a=w.slice(),b=w.slice(); a[i]=0; b[i]=1; return measureX(M,morphed(M,b))[k]-measureX(M,morphed(M,a))[k]; });
  let X,mm,s;
  for(let it=0;it<4;it++){
    X=morphed(M,w); mm=measureX(M,X); s=goal.h/mm.H;
    if(it===3) break;
    MKEYS.forEach((k,i)=>{ w[i]=Math.max(-.35,Math.min(1.35,w[i]+(goal[k]/s-mm[k])/sl[i])); });
  }
  return MESH.fit[id]={w,X,mm,s};
}

/* 显示用网格：只改外观，不影响测量——头部抹成光滑的人台头、手和全身轻度平滑、手臂向身体收拢，再 Loop 细分一次 */
function adjOf(nv,idx){
  const off=new Uint32Array(nv+1), es=[];
  for(let f=0;f<idx.length;f+=3) for(let e=0;e<3;e++){ const a=idx[f+e], b=idx[f+(e+1)%3]; if(a<b) es.push(a,b); } // 闭合网格：每条边恰好出现一次 a<b
  for(let i=0;i<es.length;i+=2){ off[es[i]+1]++; off[es[i+1]+1]++; }
  for(let i=0;i<nv;i++) off[i+1]+=off[i];
  const nb=new Uint32Array(off[nv]), at=off.slice(0,nv);
  for(let i=0;i<es.length;i+=2){ const a=es[i],b=es[i+1]; nb[at[a]++]=b; nb[at[b]++]=a; }
  return {off,nb};
}
// 向邻居平均值移动 k·w；dim=3 是坐标，dim=1 是标量
function relax(V,A,w,k,dim){
  const n=A.off.length-1, D=new Float32Array(n*dim);
  for(let i=0;i<n;i++){ const wi=w?w[i]:1; if(!wi) continue; const o=A.off[i], e=A.off[i+1];
    for(let c=0;c<dim;c++){ let t=0; for(let j=o;j<e;j++) t+=V[A.nb[j]*dim+c]; D[i*dim+c]=(t/(e-o)-V[i*dim+c])*wi*k; } }
  for(let i=0;i<D.length;i++) V[i]+=D[i];
}
const taubin=(X,A,w,it)=>{ for(let i=0;i<it;i++){ relax(X,A,w,.5,3); relax(X,A,w,-.53,3); } };
const sstep=(a,b,x)=>{ const t=Math.min(1,Math.max(0,(x-a)/(b-a))); return t*t*(3-2*t); };
// 原始网格是 A 字姿势（手臂与竖直约 40°、略向前），绕肩关节转到约 19°并向后收一点，肩根处渐变过渡
function poseArms(M,X,H){
  const a0=.69, rot=.36, back=.2, py=.80*H, pz=-.03*H;
  for(let i=0;i<M.nv;i++){
    const x=X[i*3], y=X[i*3+1]/H, p=M.part[i]; if(!(p===1||(p===4&&y>.4&&y<.8))) continue;
    const sg=x>0?1:-1, px=sg*.11*H, dx=x-px, dy=X[i*3+1]-py, t=dx*sg*Math.sin(a0)-dy*Math.cos(a0);
    const w=sstep(0,.07*H,t); if(!w) continue;
    const th=-sg*rot*w, c=Math.cos(th), sn=Math.sin(th);
    const ny=dx*sn+dy*c, dz=X[i*3+2]-pz, cb=Math.cos(back*w), sb=Math.sin(back*w);
    X[i*3]=px+dx*c-dy*sn; X[i*3+1]=py+ny*cb-dz*sb; X[i*3+2]=pz+ny*sb+dz*cb;
  }
}
// 头部投影到一个上圆下收的蛋形上，去掉五官和耳朵，像人台
function eggHead(M,X,H){
  const hd=[]; let cx=0,cz=0,y0=1e9,y1=-1e9,zx=0,z0=1e9,z1=-1e9;
  for(let i=0;i<M.nv;i++){ const y=X[i*3+1]/H; if(M.part[i]!==4||y<.885) continue; hd.push(i); cx+=X[i*3]; y0=Math.min(y0,X[i*3+1]); y1=Math.max(y1,X[i*3+1]); z0=Math.min(z0,X[i*3+2]); z1=Math.max(z1,X[i*3+2]); }
  if(!hd.length) return; cx/=hd.length; cz=(z0+z1)/2;
  const ry=(y1-y0)/2, cy=y0+ry*1.05, rz=(z1-z0)/2*.84, rx=Math.min(rz*.9,ry*.74); cz+=rz*.18; // 头往前一点坐在脖子上
  const wv=new Float32Array(M.nv); for(let i=0;i<M.nv;i++) if(M.part[i]===4) wv[i]=sstep(.848,.888,X[i*3+1]/H);
  const project=()=>{ for(let i=0;i<M.nv;i++){ if(!wv[i]) continue;
    const dx=X[i*3]-cx, dy=X[i*3+1]-cy, dz=X[i*3+2]-cz, u=Math.max(-1,Math.min(1,dy/ry));
    const tp=u<0?1-.34*u*u:1;                       // 下半部收窄成下巴
    const sx=rx*tp, sz=rz*tp, sy=ry*(u<0?1.22:1);
    const k=1/Math.sqrt((dx/sx)**2+(dy/sy)**2+(dz/sz)**2||1);
    X[i*3]+=dx*(k-1)*wv[i]; X[i*3+1]+=dy*(k-1)*wv[i]; X[i*3+2]+=dz*(k-1)*wv[i]; } };
  // 眼窝、嘴里的点投影后会折叠：投影和松弛交替几轮，让网格在蛋形上铺平
  const A=MESH.adj; for(let r=0;r<6;r++){ project(); for(let i=0;i<4;i++) relax(X,A,wv,.6,3); } project();
}
function loopSub(M,X,A){
  const nv=M.nv, I=M.idx, emap=new Map(), E=[], eid=new Uint32Array(I.length); let ne=0;
  for(let f=0;f<I.length;f+=3) for(let e=0;e<3;e++){
    const a=I[f+e], b=I[f+(e+1)%3], c=I[f+(e+2)%3], key=a<b?a*nv+b:b*nv+a; let id=emap.get(key);
    if(id===undefined){ id=ne++; emap.set(key,id); E.push(a,b,c,c); } else E[id*4+3]=c;
    eid[f+e]=nv+id; }
  const N=nv+ne, Y=new Float32Array(N*3), sv=new Float32Array(N*3), part=new Uint8Array(N);
  for(let i=0;i<nv;i++){ const o=A.off[i], n=A.off[i+1]-o, be=n===3?3/16:3/(8*n);
    for(let k=0;k<3;k++){ let t=0; for(let j=o;j<o+n;j++) t+=X[A.nb[j]*3+k]; Y[i*3+k]=X[i*3+k]*(1-n*be)+t*be; sv[i*3+k]=M.sv[i*3+k]; }
    part[i]=M.part[i]; }
  for(let e=0;e<ne;e++){ const a=E[e*4],b=E[e*4+1],c=E[e*4+2],d=E[e*4+3], o=(nv+e)*3;
    for(let k=0;k<3;k++){ Y[o+k]=.375*(X[a*3+k]+X[b*3+k])+.125*(X[c*3+k]+X[d*3+k]); sv[o+k]=(M.sv[a*3+k]+M.sv[b*3+k])/2; }
    part[nv+e]=M.part[a]; }
  const idx=new (N>65535?Uint32Array:Uint16Array)(I.length*4);
  for(let f=0,t=0;f<I.length;f+=3,t+=12){ const a=I[f],b=I[f+1],c=I[f+2],ab=eid[f],bc=eid[f+1],ca=eid[f+2];
    idx.set([a,ab,ca, ab,b,bc, ca,bc,c, ab,bc,ca],t); }

}
function dispMesh(M,F){

  for(let i=0;i<nv;i++){ const y=X[i*3+1]/H; w[i]=M.part[i]===4&&y>.4&&y<.8?.9:0; } taubin(X,A,w,30);

/* 肌群标签图：把 MuscleMap 正/背面图按肌群画成一张编号图（半分辨率），着色器按顶点的图上坐标取色 */
const LAB_ID={front:{chest:'pecs',abs:'abs',obliques:'obliques',trapezius:'traps',deltoids:'delts',biceps:'biceps',triceps:'triceps',quadriceps:'quads',adductors:'adductors',calves:'calves',forearm:16,tibialis:16},
  back:{trapezius:'traps',rhomboids:'traps',upperBack:'lats',lowerBack:'lowback',deltoids:'delts',triceps:'triceps',gluteal:'gmax',hamstring:'hams',adductors:'adductors',calves:'calves',forearm:16}};
const LAB={W:740,H:725,ids:null};
function labelMap(){
  if(LAB.ids) return LAB.ids;
  const {W,H}=LAB, ids=new Uint8Array(W*H), c=document.createElement('canvas'); c.width=W; c.height=H; const g=c.getContext('2d',{willReadFrequently:true});
  for(const v of ['front','back']) for(const slug in LAB_ID[v]){
    const L=LAB_ID[v][slug], id=typeof L==='number'?L:REGIONS.indexOf(L); if(!MM[v][slug]) continue;
    g.setTransform(1,0,0,1,0,0); g.clearRect(0,0,W,H); g.setTransform(.5,0,0,.5,0,0); g.fill(new Path2D(MM[v][slug].join(' ')));
    const d=g.getImageData(0,0,W,H).data; for(let i=0,n=W*H;i<n;i++) if(d[i*4+3]>127) ids[i]=id;
  }

  const gx=REGIONS.indexOf('gmax'), gm=REGIONS.indexOf('gmed');
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){ const i=y*W+x; if(ids[i]===gx&&y*2<672&&Math.abs(x*2-1143)>78) ids[i]=gm; }
  return LAB.ids=ids;
}
const labelAt=(sx,sy)=>{ const x=Math.round(sx/2), y=Math.round(sy/2); return x<0||y<0||x>=LAB.W||y>=LAB.H?0:LAB.ids[y*LAB.W+x]; };

/* ---------------- 3D 人体：显示与交互 ---------------- */
const B3={r:null};
const cssv=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const cssColor=c=>{ const m=/var\((--[\w-]+)\)/.exec(c); return m?cssv(m[1]):c; };
function regionLevel(key){

}
function musclePanel(key){

}
function unmount3D(){ if(B3.r){ try{ B3.r.dispose(); }catch(e){} B3.r=null; } }
function body3dFallback(el,r){ el.classList.add('flat'); el.innerHTML=figureSVG(r,S.figView||'front'); applyFigFocus(); }
function mountBody(el,r){

  const THREE=window.THREE; let ok=!!THREE;

  if(!ok){ body3dFallback(el,r); return; }

    .catch(()=>{ if(el.isConnected){ el.classList.remove('loading'); body3dFallback(el,r); } });
}
function build3D(el,r,M){
  const THREE=window.THREE, m=r.m, c=m.cm;
  const goal={h:(m.h||163)/100,shoulder:c.shoulder/100,waist:c.waist/100,hip:c.hip/100,thigh:c.thigh/100};
  const F=fitBody(M,goal), s=F.s, H=F.mm.H, D=dispMesh(M,F), X=D.X, A=D.adj, nv=D.nv;
  const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
  renderer.setPixelRatio(Math.min(2,window.devicePixelRatio||1));
  if('outputEncoding' in renderer) renderer.outputEncoding=THREE.sRGBEncoding;
  const cv=renderer.domElement; cv.setAttribute('aria-label','你的 3D 身体模型，可拖动旋转，点肌肉查看练法'); cv.setAttribute('role','img');
  el.prepend(cv);
  const scene=new THREE.Scene(), cam=new THREE.PerspectiveCamera(22,1,.05,20);
  const root=new THREE.Group(); root.scale.setScalar(s); scene.add(root);
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(X,3));
  geo.setIndex(new THREE.BufferAttribute(D.idx,1));
  geo.computeVertexNormals();
  const col=new Float32Array(nv*3); geo.setAttribute('color',new THREE.BufferAttribute(col,3));
  // 每个顶点属于哪块肌群（按顶点在 MuscleMap 正/背面图上的坐标查表）
  labelMap();
  const nrm=geo.attributes.normal.array, rid=new Uint8Array(nv);
  for(let j=0;j<nv;j++) rid[j]=labelAt(nrm[j*3+2]>=0?D.sv[j*3]:D.sv[j*3+1],D.sv[j*3+2]);
  // 肌群图之间有空隙：在躯干和四肢上向外长几圈，把空隙补上
  for(let it=0;it<6;it++){ const nx=rid.slice();
    for(let j=0;j<nv;j++){ if(rid[j]||D.part[j]>3) continue; for(let q=A.off[j];q<A.off[j+1];q++){ const v=rid[A.nb[q]]; if(v&&v!==16){ nx[j]=v; break; } } }
    rid.set(nx); }

    for(let q=o;q<e;q++){ const k=A.nb[q]*3; x+=X[k]; y+=X[k+1]; z+=X[k+2]; l+=Math.hypot(X[k]-X[j*3],X[k+1]-X[j*3+1],X[k+2]-X[j*3+2]); }
    const n=e-o, cvx=((x/n-X[j*3])*nrm[j*3]+(y/n-X[j*3+1])*nrm[j*3+1]+(z/n-X[j*3+2])*nrm[j*3+2])/(l/n||1);
    ao[j]=Math.max(0,cvx); }
  for(let i=0;i<4;i++) relax(ao,A,null,.6,1);

function muscleSVG(view,p,s){
  const d=MM[view], vb=MM.vb[view];
  const fill=k=>p.includes(k)?'var(--accent)':s.includes(k)?'color-mix(in srgb,var(--accent) 38%,var(--body))':'var(--body)';
  const out=Object.keys(d).map(k=>`<path d="${d[k].join(' ')}" style="fill:${fill(k)}"><title>${SLUG_CN[k]||''}</title></path>`).join('');
  return `<svg viewBox="${vb.join(' ')}" role="img" aria-label="${view==='front'?'正面':'背面'}发力肌群">${out}</svg>`;
}

/* ---------------- small views ---------------- */
function ratioRow(name,c,tg){
  const lo=1.0,hi=1.6,pc=v=>Math.max(0,Math.min(100,(v-lo)/(hi-lo)*100)); const d=tg-c, ok=Math.abs(d)<0.04;
  return `<div class="ratio"><span class="small muted">${name}</span>
    <div class="track"><span class="fill" style="width:${pc(c)}%"></span><span class="dot" style="left:${pc(c)}%"></span><span class="tgt" style="left:${pc(tg)}%"></span></div>
    <span class="mono small">${f2(c)}<span class="muted"> / ${f2(tg)}</span></span></div>`;
}
function weekStrip(plan,sel,act){
  const today=todayISO();
  return `<div class="week" role="group" aria-label="本周">${weekDates().map(d=>{ const k=SCHED[d.getDay()], di=iso(d);
    let cls=k?'train':'rest', inner=k?DAYNAME[k][0]:'·';
    if(k){ const p=dayProgress(di,k,plan); if(p.total&&p.n===p.total){ cls='done'; inner=I.check; } }
    return `<button type="button" class="${cls} ${di===sel?'sel':''}" ${act?`data-act="${act}" data-arg="${di}"`:'disabled'} aria-label="周${DOW[d.getDay()]}${k?' '+DAYNAME[k]:' 休息'}"><span>${DOW[d.getDay()]}</span><span class="dd">${inner}</span>${di===today?'<span class="today-mark"></span>':'<span style="height:4px"></span>'}</button>`; }).join('')}</div>`;
}
function nextTrainDay(){ const ds=weekDates(), t=todayISO(); const td=ds.find(d=>iso(d)===t&&SCHED[d.getDay()]); if(td) return iso(td); const n=ds.find(d=>iso(d)>t&&SCHED[d.getDay()]); return n?iso(n):t; }
const imgSrc=(e,n)=>`ex/${EX[e].img}_${n}.jpg`;
// 本地没有图片时（如 GitHub Pages）退回 jsDelivr 上的 free-exercise-db 原图
document.addEventListener('error',ev=>{ const im=ev.target; if(!(im instanceof HTMLImageElement)||im.dataset.fb) return; const m=(im.getAttribute('src')||'').match(/^ex\/(.+)_(\d)\.jpg$/); if(!m) return; im.dataset.fb='1'; im.src=`https://cdn.jsdelivr.net/gh/yuhonas/free-exercise-db@main/exercises/${m[1]}/${m[2]}.jpg`; },true);

function sw(key,t,s){ return `<button class="opt" type="button" role="switch" aria-checked="${S[key]}" data-act="toggle" data-arg="${key}"><span></span><span><b style="font-weight:500">${t}</b><br><span class="muted small">${s}</span></span><span class="switch"></span></button>`; }

/* exercise frames: 起始 / 发力 两张图交替 */
let FR={t:0,i:0,auto:true};
function showFrame(i){ FR.i=i; const a=$('m0'),b=$('m1'); if(!a||!b) return; b.style.opacity=i?1:0; document.querySelectorAll('#media .ph button').forEach((x,j)=>x.setAttribute('aria-pressed',String(j===i))); }
function startFrames(){ stopFrames(); FR.auto=!matchMedia('(prefers-reduced-motion: reduce)').matches; if(FR.auto) FR.t=setInterval(()=>showFrame(FR.i?0:1),1500); }
function stopFrames(){ clearInterval(FR.t); FR.t=0; }

/* ---------------- measurement ----------------
   第 1 步身高；第 2 步正面照（头顶、脚底 + 肩/腰/臀/大腿四组宽度）；第 3 步侧面照（头顶、脚底 + 腰/臀/大腿厚度）。
   像素 × 身高 ÷ 头顶到脚底的像素高度 = 厘米。 */
const PTDEF={
  front:{lbl:{top:'头顶',bot:'脚底',sl:'肩',sr:'肩',wl:'腰',wr:'腰',hl:'臀',hr:'臀',tl:'腿',tr:'腿'},pairs:[['sl','sr'],['wl','wr'],['hl','hr'],['tl','tr']],
    def:()=>({top:[.5,.05],bot:[.5,.97],sl:[.32,.22],sr:[.68,.22],wl:[.41,.40],wr:[.59,.40],hl:[.36,.50],hr:[.64,.50],tl:[.37,.57],tr:[.49,.57]})},
  side:{lbl:{top:'头顶',bot:'脚底',wf:'腰',wb:'腰',hf:'臀',hb:'臀',tf:'腿',tb:'腿'},pairs:[['wf','wb'],['hf','hb'],['tf','tb']],
    def:()=>({top:[.5,.05],bot:[.5,.97],wf:[.44,.40],wb:[.58,.40],hf:[.42,.50],hb:[.60,.50],tf:[.43,.57],tb:[.57,.57]})}
};
PTDEF.ref=PTDEF.front; // 参考照片用同一套正面点位
function viewCalc(view){
  const ph=T.ph[view]; if(!ph||!ph.pts||!ph.nw) return null;
  const p=ph.pts, H=S.h; const hpx=(p.bot[1]-p.top[1])*ph.nh; if(!H||hpx<50) return null;
  const k=H/hpx, w=(a,b)=>Math.abs(p[b][0]-p[a][0])*ph.nw*k, fy=y=>(p.bot[1]-y)/(p.bot[1]-p.top[1]);
  if(view==='front') return {shoulderW:w('sl','sr'),waistW:w('wl','wr'),hipW:w('hl','hr'),thighW:w('tl','tr'),
    waistF:fy((p.wl[1]+p.wr[1])/2),hipF:fy((p.hl[1]+p.hr[1])/2),legR:fy((p.hl[1]+p.hr[1])/2)};
  return {waistD:w('wf','wb'),hipD:w('hf','hb'),thighD:w('tf','tb')};
}
// 拍照扫描：只用一张正面照，厚度按常见体型估算
function scanMeas(){
  const f=viewCalc('front'); if(!f||f.waistW<5) return null;
  const raw={shoulderW:f.shoulderW,waistW:f.waistW,hipW:f.hipW,thighW:f.thighW};
  const m=derive(raw,S.h,f.legR); m.waistF=f.waistF; m.hipF=f.hipF; m.raw=raw; m.src='scan'; return m;
}
/* 手动输入：软尺量的围度。围度 → 宽度按常见体型的厚宽比反推（周长对宽度是线性的），再走同一套 derive */
const MAN_FIELDS=[
  {k:'shoulder',name:'肩宽',hint:'两侧肩峰（肩膀最外侧的骨点）之间的直线距离',min:25,max:60,ph:'36'},
  {k:'waist',name:'腰围',hint:'肚脐上方最细处绕一圈，自然呼气时量',min:45,max:150,ph:'68'},
  {k:'hip',name:'臀围',hint:'臀部最翘、最宽处水平绕一圈',min:60,max:170,ph:'92'},
  {k:'thigh',name:'大腿围',hint:'大腿根下方最粗处绕一圈，不填按臀围估算',min:30,max:95,ph:'52',opt:1}
];
function manualMeas(){
  const v=T.man||{}, num=k=>{ const x=parseFloat(v[k]); return isFinite(x)?x:0; };
  const bad=MAN_FIELDS.find(f=>{ const x=num(f.k); return f.opt&&!x?false:!(x>=f.min&&x<=f.max); });
  if(bad||!(S.h>=120&&S.h<=210)) return null;
  const est=[], thighC=num('thigh')||(est.push('thigh'),num('hip')*.56);
  const raw={shoulderW:num('shoulder'),waistW:num('waist')/ellipse(1,DEPTH_K.waist),hipW:num('hip')/ellipse(1,DEPTH_K.hip),thighW:thighC/ellipse(1,DEPTH_K.thigh)};
  const m=derive(raw,S.h,null); m.est=est; m.raw=raw; m.src='manual'; return m;
}
const draftMeas=()=>T.mtab==='scan'?scanMeas():manualMeas();
// 切到手动输入时，用已有数据（刚扫描的 > 已保存的）预填
function manFill(){
  if(T.man) return; const m=scanMeas()||S.meas; T.man={};
  if(m&&m.cm){ T.man={shoulder:f1(m.cm.shoulder),waist:String(Math.round(m.cm.waist)),hip:String(Math.round(m.cm.hip))}; if(!m.est.includes('thigh')) T.man.thigh=String(Math.round(m.cm.thigh)); }
}
function readoutHTML(m){
  if(!m) return `<p class="small muted">${T.mtab==='scan'?'填好身高、放好正面照的点之后，这里会出现结果。':'填好身高、肩宽、腰围、臀围之后，这里会出现结果。'}</p>`;
  const e=k=>m.est.includes(k)?'<span class="est">估</span>':'';
  const cell=(k,v,u='cm',x='')=>`<div><span class="k">${k}${x}</span><span class="num">${v}<small class="mono xs muted"> ${u}</small></span></div>`;
  return `<div class="readout">${cell('肩宽',f1(m.cm.shoulder))}${cell('腰围',Math.round(m.cm.waist),'cm',e('waist'))}${cell('臀围',Math.round(m.cm.hip),'cm',e('hip'))}${cell('大腿围',Math.round(m.cm.thigh),'cm',e('thigh'))}${cell('腰臀比',f2(m.whr),'')}${m.legR?cell('腿长比',Math.round(m.legR*100),'%'):''}${cell('肩腰比',f2(m.swr),'')}${cell('臀腰比',f2(m.hwr),'')}</div>
    ${m.est.length?`<p class="xs muted">${m.src==='scan'?'标「估」的由照片宽度按常见体型估算，想更准可以切到「手动输入」用软尺量的数改一下。':'大腿围没填，按臀围估算。'}</p>`:''}`;
}
/* ---------------- 目标：逐项差距 ---------------- */
const fmtD=(k,v)=>v==null?'—':k==='shoulder'?f1(v):String(Math.round(v));
const GAP_TH={shoulder:.5,hip:1.5,thigh:1.5,waist:2};
// 每项：要做什么、大约几周（按一个阶段 12 周走 STEP cm 估算）、是否已到骨架上限
function gapRows(cc,tc,cap){
  return `<div class="gaps">${DIMS.map(([k,n])=>{
    if(tc[k]==null) return `<div class="gap"><span class="k">${n}</span><span class="v mono">${fmtD(k,cc[k])}</span><span class="d mono muted">—</span><span class="w xs muted">这个模板不设定</span></div>`;
    const d=Math.round((k==='waist'?cc[k]-tc[k]:tc[k]-cc[k])*10)/10, th=GAP_TH[k], atCap=cap&&k!=='waist'&&cc[k]>=cap[k]-.3;
    let cls='acc', sign='✓', why='已达到';
    if(d>=th){ cls='warm'; sign=(k==='waist'?'−':'+')+f1(d); why=(k==='waist'?'靠整体体脂下降':'练'+DIM_MU[k])+` · 约 ${Math.max(2,Math.round(d/STEP[k]*12/2)*2)} 周`; }
    else if(k==='thigh'&&d<=-2){ cls='under'; sign='−'+f1(-d); why='减少腿部训练量'; }
    else if(k!=='waist'&&d<=-1) why='已超过目标';
    return `<div class="gap"><span class="k">${n}</span><span class="v mono">${fmtD(k,cc[k])} → <b>${fmtD(k,tc[k])}</b></span><span class="d mono ${cls}">${sign}</span><span class="w xs muted">${why}${atCap?' · 已到骨架上限':''}</span></div>`;
  }).join('')}</div>`;
}

/* ---------------- 参考照片 ----------------
   和拍照扫描同一套点位与自动识别，只取像素比例（参考照片没有真实身高）。
   全身照：各项宽度 ÷ 头顶到脚底高度，乘以你的身高；不是全身照：以你的腰围（不超过理想值）为基准按比例换算。
   超过你骨架上限的项按上限算，并提示。 */
function refCalc(){
  const ph=T.ph.ref; if(!ph||!ph.pts||!ph.nw) return null;
  const p=ph.pts, w=(a,b)=>Math.abs(p[b][0]-p[a][0])*ph.nw, H=(p.bot[1]-p.top[1])*ph.nh;
  const sw=w('sl','sr'), ww=w('wl','wr'), hw=w('hl','hr'), tw=w('tl','tr'); if(ww<4||hw<4) return null;
  const full=T.refFull!==false&&H>ww*3;
  return {swr:sw/ww,hwr:hw/ww,thr:tw/hw,full,sH:sw/H,wH:ww/H};
}
// 正常人体正面比例的范围；超出多半是点位没放准（手臂和身体粘连、持物、侧身）
const REF_OK={swr:[1.15,1.75],hwr:[1.1,1.75],thr:[.4,.7]};
const refOdd=f=>Object.keys(REF_OK).filter(k=>f[k]<REF_OK[k][0]||f[k]>REF_OK[k][1]);
function refToCm(f,m){
  const c=m.cm, h=m.h||163, cap=capOf(h,S.af.frame), E=x=>ellipse(1,x), q={};
  for(const k in REF_OK) q[k]=Math.min(REF_OK[k][1],Math.max(REF_OK[k][0],f[k]));
  const ww=f.full?f.wH*h:Math.min(c.waist,cap.waist)/E(DEPTH_K.waist);
  const cm={shoulder:q.swr*ww,waist:ww*E(DEPTH_K.waist),hip:q.hwr*ww*E(DEPTH_K.hip),thigh:q.thr*q.hwr*ww*E(DEPTH_K.thigh)}, clamped=[];
  for(const k of ['shoulder','hip','thigh']){
    if(cm[k]>cap[k]){ cm[k]=cap[k]; clamped.push(k); }
    else if(cm[k]<c[k]-2*STEP[k]){ cm[k]=c[k]-2*STEP[k]; clamped.push(k); } // 不把「大幅减掉肌肉」当目标
  }
  if(cm.waist<cap.waist*.9){ cm.waist=cap.waist*.9; clamped.push('waist'); }
  return {cm,clamped};
}
function refTags(f){
  const t=[];
  if(f.swr>=1.45) t.push('直角肩、背部有宽度'); else if(f.swr<=1.32) t.push('肩线柔和');
  if(f.hwr>=1.42) t.push('臀部饱满、腰臀差明显'); else if(f.hwr<=1.3) t.push('胯窄、线条偏直');
  if(f.thr<=.5) t.push('腿部纤细'); else if(f.thr>=.58) t.push('腿部有力量感');
  if(f.full&&f.wH<=.145) t.push('腰很细');
  if(f.swr>=1.42&&f.hwr>=1.42) t.push('X 型');
  return t.length?t:['比例均衡'];
}
function refHTML(){
  const f=refCalc(); if(!f) return '<p class="small muted">放好照片上的点之后，这里会出现提取到的特征，以及你和它的差距。</p>';
  const m=cur(), R=refToCm(f,m), cap=capOf(m.h||163,S.af.frame);
  const near=TARGETS.map(x=>({x,d:Math.hypot(x.swr-f.swr,x.hwr-f.hwr)})).sort((a,b)=>a.d-b.d)[0].x;
  const cell=(k,v)=>`<div><span class="k">${k}</span><span class="num">${v}</span></div>`;
  const cn=R.clamped.map(k=>DIMS.find(d=>d[0]===k)[1]).join('、');
  const odd=refOdd(f).map(k=>({swr:'肩腰比',hwr:'臀腰比',thr:'腿臀比'})[k]);
  return `${odd.length?`<p class="status err">${odd.join('、')}超出了常见人体范围，多半是点位没放准（手臂贴着身体、手里拿着东西、侧身都会影响）。请放大核对腰和腿的点；换算时已按常见范围的边界处理。</p>`:''}
    <p class="eyebrow">提取到的特征</p>
    <div class="chips">${refTags(odd.length?{...f,...Object.fromEntries(Object.entries(REF_OK).map(([k,[a,b]])=>[k,Math.min(b,Math.max(a,f[k]))])),full:false}:f).map(x=>`<span class="chip2" style="cursor:default">${x}</span>`).join('')}</div>
    <div class="readout">${cell('肩腰比',f2(f.swr))}${cell('臀腰比',f2(f.hwr))}${cell('腿臀比',f2(f.thr))}${f.full?cell('肩宽 / 身高',f2(f.sH)):''}</div>
    <p class="xs muted">最接近的预设：${near.name}。比例按正面宽度算，和你的测量口径一致。</p>
    <p class="eyebrow" style="margin-top:6px">换算到你的身材 · ${f.full?`按身高 ${m.h||163} cm`:'按你的腰围'}</p>
    ${gapRows(m.cm,R.cm,cap)}
    ${cn?`<p class="xs muted">${cn}换算后超出了合理范围（高于你骨架的上限，或要大幅减掉肌肉），已按边界计算。这部分差距多半来自骨架、拍摄角度或修图，靠训练练不出来。</p>`:''}
    <button class="btn block acc" type="button" data-act="useRef">设为我的目标</button>`;
}

async function initCam(){

  try{ stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480}},audio:false}); }
  catch(e){ manualMode(e&&e.name==='NotAllowedError'?'没有拿到摄像头权限':'这里打不开摄像头'); return; }

  C.stream=stream; const v=$('cv'); v.srcObject=stream; try{ await v.play(); }catch(e){}

    await Promise.race([loadVideoModel(), new Promise((_,j)=>setTimeout(()=>j(new Error('timeout')),100000))]);
  }catch(e){ if(C===me){ manualMode('AI 模型加载失败',true); setStat('手动模式 · 模型未加载','warn'); } return; }

async function loadVideoModel(){

function loop(){
  if(!C||!lmkV) return;
  const v=$('cv'); if(!v) return;
  if(v.readyState>=2 && v.currentTime!==C.lastT){
    C.lastT=v.currentTime; AR=(v.videoWidth||4)/(v.videoHeight||3);
    let r=null; try{ r=lmkV.detectForVideo(v,performance.now()); }catch(e){}
    const L=r&&r.landmarks&&r.landmarks[0];
    draw(L,v);
    if(L) onPose(L);
  }
  C.raf=requestAnimationFrame(loop);
}
function draw(L,v){
  const c=$('cc'); if(!c) return; const dpr=window.devicePixelRatio||1;
  const cw=c.clientWidth, ch=c.clientHeight; if(c.width!==Math.round(cw*dpr)){ c.width=Math.round(cw*dpr); c.height=Math.round(ch*dpr); }
  const g=c.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,cw,ch); if(!L) return;
  const vw=v.videoWidth, vh=v.videoHeight, s=Math.max(cw/vw,ch/vh), ox=(cw-vw*s)/2, oy=(ch-vh*s)/2;
  const P=i=>[L[i].x*vw*s+ox, L[i].y*vh*s+oy];
  const col=C&&C.cueBad&&Date.now()-C.cueAt<2500?'#f0a347':'#4cbcae';
  g.lineWidth=4; g.lineCap='round'; g.strokeStyle=col;
  for(const [a,b] of EDGES){ if((L[a].visibility??1)<.5||(L[b].visibility??1)<.5) continue; const p=P(a),q=P(b); g.beginPath(); g.moveTo(p[0],p[1]); g.lineTo(q[0],q[1]); g.stroke(); }
  g.fillStyle='#ffffff';
  for(const i of [11,12,13,14,15,16,23,24,25,26,27,28]){ if((L[i].visibility??1)<.5) continue; const p=P(i); g.beginPath(); g.arc(p[0],p[1],5,0,7); g.fill(); }
}
function onPose(L){
  const cur=C.q[C.i], t=TRK[cur.trk]||TRK.hold;
  const ok=t.ok(L); if(ok) C.lastSeen=Date.now();
  if((C.phase==='prep'||C.phase==='rest') && seen(L,[7,8,11,12])){ const g=shrugGap(L); C.ctx.base=C.ctx.base?C.ctx.base*0.9+g*0.1:g; }
  if(C.paused||C.phase!=='work'||!ok) return;
  if(!t.hold){
    const raw=t.m(L); C.ema=C.ema==null?raw:C.ema*0.6+raw*0.4; const m=C.ema; C.m=m;
    if(t.start==='lo'){ if(C.state==='start'&&m>=t.hi) C.state='peak'; else if(C.state==='peak'&&m<=t.lo){ C.state='start'; onRep(); if(!C||C.phase!=='work') return; } }
    else { if(C.state==='start'&&m<=t.lo) C.state='peak'; else if(C.state==='peak'&&m>=t.hi){ C.state='start'; onRep(); if(!C||C.phase!=='work') return; } }
  }
  const checks=(t.checks||[]).concat(noteChecks(cur.e).filter(f=>!(t.checks||[]).includes(f)));

}
function onRep(){

function tick(){
  if(!C||C.paused||C.phase==='done') return;

    <button class="btn block" type="button" data-tab="home">回到首页</button><button class="btn ghost block" type="button" data-tab="train">看训练</button>`;
}

  addNote(e){ const i=$('noteIn'); const v=(i&&i.value||'').trim(); if(!v){ toast('先写点什么'); return; }
    const d=new Date(); (S.notes[e]=S.notes[e]||[]).unshift({txt:v.slice(0,140),t:`${d.getMonth()+1}月${d.getDate()}日`}); save(); refresh(); toast('记下了，下次跟练会提醒你'); },
  delNote(a){ const [e,j]=a.split('|'); const n=S.notes[e]; if(!n) return; n.splice(+j,1); if(!n.length) delete S.notes[e]; save(); refresh(); },
  swapEx(a){ const [k,mu,x,date,i]=a.split('|'); S.swap[k+':'+mu]=x; save(); stack[stack.length-1].a=`${x}|${date}|${k}|${i}`; render(); },
  toggleDone(a){ const [date,e]=a.split('|'); const key=date+':'+e; const now=!S.done[key]; if(now) S.done[key]=1; else delete S.done[key]; save(); if(now){ toast('完成：'+EX[e].name); back(); } else refresh(); }
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-go],[data-tab],[data-act],[data-back]'); if(!el||el.disabled) return;
  if(el.dataset.back) back();
  else if(el.dataset.tab) tab(el.dataset.tab);
  else if(el.dataset.act) ACT[el.dataset.act]&&ACT[el.dataset.act](el.dataset.arg);
  else if(el.dataset.go) go(el.dataset.go,el.dataset.arg);
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape') back(); });
document.addEventListener('input',e=>{ if(e.target.id==='noteIn'){ const t=e.target; t.style.height='auto'; t.style.height=Math.min(120,t.scrollHeight)+'px'; } });

render();
loadPhotos();
})();
</script>

if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost')){
  addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(e=>console.warn('[BodyNav] sw',e)));
}

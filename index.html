<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>薄肌比例导航</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: phone shell. Home = body vs target; one path into the week plan; settings live under 我的. */
:root{
  --desk:#e3e8e5; --bg:#f5f7f6; --surface:#ffffff; --ink:#15201d; --muted:#66736f; --line:#e2e7e4;
  --accent:#0d6b63; --accent-ink:#ffffff; --soft:#e2f1ee; --body:#d5ddda; --warm:#c4610a; --warm-soft:#fcecdc;
  --display:"Bricolage Grotesque","PingFang SC","Noto Sans SC",system-ui,sans-serif;
  --text:"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --desk:#080c0b; --bg:#0e1413; --surface:#17201f; --ink:#e7eeec; --muted:#97a9a5; --line:#25302e;
  --accent:#4cbcae; --accent-ink:#05201c; --soft:#173632; --body:#2e3b39; --warm:#f0a347; --warm-soft:#3a2a17; color-scheme:dark}}
:root[data-theme="dark"]{
  --desk:#080c0b; --bg:#0e1413; --surface:#17201f; --ink:#e7eeec; --muted:#97a9a5; --line:#25302e;
  --accent:#4cbcae; --accent-ink:#05201c; --soft:#173632; --body:#2e3b39; --warm:#f0a347; --warm-soft:#3a2a17; color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--desk);color:var(--ink);font-family:var(--text);font-size:15px;line-height:1.5;overflow:hidden}
button{font:inherit;color:inherit}
p,h1,h2,h3{margin:0}
.app{position:relative;height:100%;max-width:430px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
@media (min-width:600px){.app{height:calc(100% - 48px);max-height:880px;margin-top:24px;border-radius:32px;border:1px solid var(--line);box-shadow:0 20px 60px rgba(0,0,0,.16)}}

.top{flex:none;display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;height:52px;padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px))}
.top h1{text-align:center;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top.root h1{grid-column:1 / 3;text-align:left;padding-left:10px;font-family:var(--display);font-size:22px}
.iconbtn{width:40px;height:40px;border:0;background:transparent;border-radius:12px;display:grid;place-items:center;cursor:pointer}
.iconbtn svg{width:22px;height:22px}

.view{flex:1;overflow-y:auto;overscroll-behavior:contain;padding-block:4px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.view>*{flex-shrink:0}
[hidden]{display:none!important}
.view.fwd{animation:inR .22s ease-out}.view.back{animation:inL .22s ease-out}
@keyframes inR{from{transform:translateX(24px);opacity:.4}to{transform:none;opacity:1}}
@keyframes inL{from{transform:translateX(-24px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.view,.sheet{animation:none!important}}

.tabs{flex:none;display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border-top:1px solid var(--line)}
.tabs button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 10px;font-size:11px;color:var(--muted);cursor:pointer}
.tabs button svg{width:24px;height:24px}
.tabs button[aria-current="page"]{color:var(--accent);font-weight:600}

.card{background:var(--surface);border-radius:20px;padding:16px 18px}
.label{font-size:12px;color:var(--muted);letter-spacing:.06em}
.muted{color:var(--muted)}
.small{font-size:13px}
.big{font-family:var(--display);font-size:22px;line-height:1.3;text-wrap:balance}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border-radius:16px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:16px;cursor:pointer}
.btn svg{width:18px;height:18px}
.btn.ghost{background:transparent;color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* home: body */
.bodyfig{display:flex;justify-content:center;margin:2px 0 4px}
.bodyfig svg{width:100%;max-width:165px;height:auto}
.legend{display:flex;justify-content:center;gap:18px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:20px;height:0;border-top:2px solid var(--ink)}
.legend i.dash{border-top:2px dashed var(--accent)}

.gap{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.gap:first-child{border-top:0}
.gap .n{font-size:13.5px;color:var(--muted)}
.gap .v{font-family:var(--mono);font-size:13px;text-align:right;white-space:nowrap}
.gap .v b{font-size:16px}
.gap .d{grid-column:2 / -1;font-family:var(--mono);font-size:12px;color:var(--warm)}
.gap .d.ok{color:var(--accent)}
.track{position:relative;height:8px;border-radius:4px;background:var(--line)}
.track .fill{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--ink)}
.track .tgt{position:absolute;top:-5px;bottom:-5px;width:0;border-left:2px dashed var(--accent)}

/* week strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.week .d{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.dot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600}
.dot.train{background:var(--soft);color:var(--accent)}
.dot.rest{color:var(--muted)}
.dot.done{background:var(--accent);color:var(--accent-ink)}
.dot.today{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
.dot svg{width:16px;height:16px}

/* rows */
.rows{background:var(--surface);border-radius:20px;overflow:hidden}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;width:100%;padding:15px 16px;border:0;border-top:1px solid var(--line);background:transparent;text-align:left;cursor:pointer}
.row:first-child{border-top:0}
.row:active{background:var(--bg)}
.row[disabled]{cursor:default}
.row .t{display:block;font-weight:600}
.row .s{display:block;font-size:13px;color:var(--muted);margin-top:1px}
.row .r{display:flex;align-items:center;gap:4px;color:var(--muted);font-size:13px}
.row .r svg{width:16px;height:16px}
.day{width:42px;text-align:center}
.day b{display:block;font-size:15px}
.day span{font-size:11px;color:var(--muted)}
.num{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--accent);font-family:var(--mono);font-size:13px;font-weight:600}
.num.done{background:var(--accent);color:var(--accent-ink)}
.num svg{width:15px;height:15px}
.tag{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--accent);margin-left:6px;vertical-align:1px}
.tag.today{background:var(--ink);color:var(--surface)}
.prog{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent)}

/* options */
.opt{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;width:100%;padding:12px 16px;border:0;border-top:1px solid var(--line);background:transparent;text-align:left;cursor:pointer}
.opt:first-child{border-top:0}
.opt svg.mini{width:34px;height:60px}
.radio{width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--muted);display:grid;place-items:center}
.opt[aria-checked="true"] .radio{background:var(--accent);box-shadow:none;color:var(--accent-ink)}
.radio svg{width:14px;height:14px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:9px;padding:9px 4px;font-size:14px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600}
.switch{width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
[aria-checked="true"] .switch{background:var(--accent)}
[aria-checked="true"] .switch::after{transform:translateX(18px)}

/* photo */
.drop{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;border:1.5px dashed var(--muted);border-radius:16px;padding:26px 12px;cursor:pointer;text-align:center}
.drop input{position:absolute;opacity:0;width:1px;height:1px}
.stage{position:relative;border-radius:14px;overflow:hidden;background:var(--line);touch-action:none;user-select:none}
.stage img{display:block;width:100%;height:auto}
.stage svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.pt{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;touch-action:none;cursor:grab;outline:none}
.pt::before{content:"";position:absolute;left:50%;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px #fff,0 1px 4px rgba(0,0,0,.5)}
.pt::after{content:"";position:absolute;left:50%;top:50%;width:1px;height:1px;margin:-.5px 0 0 -.5px;background:#fff}
.pt.on::before{width:6px;height:6px;margin:-3px 0 0 -3px;box-shadow:0 0 0 1.5px #fff}
.pt:focus-visible::before{box-shadow:0 0 0 2px #fff,0 0 0 5px var(--accent)}
.pt b{position:absolute;left:50%;bottom:31px;transform:translateX(-50%);font:600 10px/1 system-ui,sans-serif;padding:3px 5px;border-radius:5px;background:rgba(0,0,0,.55);color:#fff;white-space:nowrap;pointer-events:none}
.pt.on b{opacity:0}
.loupe{position:absolute;top:10px;width:132px;height:132px;border-radius:50%;border:2px solid #fff;box-shadow:0 4px 16px rgba(0,0,0,.45);pointer-events:none;overflow:hidden;background:#000;z-index:3}
.loupe canvas{display:block;width:100%;height:100%}
.ptip{font-size:12px;color:var(--muted);margin:6px 2px 0}
.status{font-size:13px;color:var(--muted)}
.status.err{color:var(--warm)}

/* sheet + toast */
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.42);z-index:20;display:flex;align-items:flex-end}
.sheet{width:100%;max-height:88%;overflow-y:auto;background:var(--surface);border-radius:24px 24px 0 0;padding-block:10px 22px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px;animation:up .2s ease-out}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto}
@keyframes up{from{transform:translateY(40px)}to{transform:none}}
ol.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;counter-reset:s}
ol.steps li{display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;counter-increment:s;font-size:14.5px}
ol.steps li::before{content:counter(s);width:26px;height:26px;border-radius:50%;background:var(--soft);color:var(--accent);font-family:var(--mono);font-size:12px;font-weight:600;display:grid;place-items:center}
.tip{border-radius:14px;padding:11px 14px;font-size:13.5px;background:var(--soft)}
.tip.warn{background:var(--warm-soft)}
.alts{display:flex;flex-wrap:wrap;gap:8px}
.alt{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:14px;cursor:pointer}
.alt[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:600}
.toast{position:absolute;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;white-space:nowrap;z-index:30}

/* coach */
.app.immersive .top,.app.immersive .tabs{display:none}
.app.immersive .view{padding:0;gap:0;overflow:hidden}
.sess{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;background:var(--surface)}
.cam{position:relative;flex:1 1 55%;min-height:220px;background:#0b0f0e;overflow:hidden}
.cam video,.cam canvas{position:absolute;inset:0;width:100%;height:100%;transform:scaleX(-1)}
.cam video{object-fit:cover}
.camtop{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding-top:12px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));z-index:3}
.camtop button{width:40px;height:40px;border-radius:50%;border:0;background:rgba(0,0,0,.45);color:#fff;display:grid;place-items:center;cursor:pointer}
.camtop svg{width:20px;height:20px}
.chip{background:rgba(0,0,0,.5);color:#fff;font-size:12.5px;padding:6px 12px;border-radius:999px;display:inline-flex;align-items:center;gap:6px}
.chip i{width:8px;height:8px;border-radius:50%;background:#9aa6a3}
.chip.live i{background:#4ade80}
.chip.warn i{background:#f0a347}
.bigcount{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:14px;color:#fff;font-family:var(--mono);font-size:58px;font-weight:600;line-height:1;text-shadow:0 2px 12px rgba(0,0,0,.55);z-index:2;transition:transform .12s}
.bigcount small{font-size:19px;opacity:.85;margin-left:6px;font-weight:400}
.bigcount.pop{transform:scale(1.18)}
.camfb{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;padding:64px 28px 90px;color:#e7eeec;text-align:center;font-size:13.5px;line-height:1.6;z-index:1}
.camfb b{font-size:16px}
.camfb .ok{font-size:64px;line-height:1}
.panel{flex:0 0 auto;padding-block:14px 16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:10px}
.cue{border-radius:14px;padding:11px 14px;font-size:14.5px;background:var(--soft);min-height:44px}
.cue.bad{background:var(--warm-soft);font-weight:600}
.nextup{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;color:var(--muted);padding:0 2px}
.nextup b{color:var(--ink);text-align:right}
.pdots{display:flex;gap:4px}
.pdots i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.pdots i.on{background:var(--accent)}
.pdots i.cur{background:var(--ink)}
.ctrl{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:8px}
.ctrl .btn{min-height:48px;font-size:15px}
.coach-hero{background:var(--accent);color:var(--accent-ink);display:flex;flex-direction:column;gap:10px}
.coach-hero .label,.coach-hero .muted{color:inherit;opacity:.85}
.coach-hero .btn{background:var(--surface);color:var(--accent)}
.coach-hero .seg{background:rgba(255,255,255,.18)}
.coach-hero .seg button{color:inherit}
.coach-hero .seg button[aria-pressed="true"]{color:var(--ink)}
.mtag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;background:var(--soft);color:var(--accent);margin-left:6px;vertical-align:1px;font-weight:600}
.mtag.t{background:var(--line);color:var(--muted)}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top" id="top"></header>
  <main class="view" id="view"></main>
  <nav class="tabs" id="tabs" aria-label="主导航"></nav>
</div>

<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
const f2=v=>(Math.round(v*100)/100).toFixed(2);

const I={
  coach:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="13" height="12" rx="2.5"/><path d="M16 10.5l5-3v9l-5-3"/><circle cx="9.5" cy="12" r="2.2"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  vol:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5v14l-4.5-4.5H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>',
  mute:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5v14l-4.5-4.5H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>',
  checkBig:'<svg viewBox="0 0 24 24" width="64" height="64" fill="none" stroke="#4cbcae" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M7.5 12.5l3 3 6-6.5"/></svg>',
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 10.5 12 4l8 6.5V20H14.5v-6h-5v6H4z"/></svg>',
  me:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20c1-3.8 4-6 7.5-6s6.5 2.2 7.5 6"/></svg>',
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  chev:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>'
};

/* ---------------- data ---------------- */
const TARGETS=[
  {id:'square',name:'直角肩薄背',swr:1.45,hwr:1.30,note:'肩线清晰，背部有宽度'},
  {id:'peach',name:'蜜桃线条',swr:1.34,hwr:1.45,note:'臀部饱满，腰臀差明显'},
  {id:'balanced',name:'均衡薄肌',swr:1.40,hwr:1.38,note:'上下比例匀称'},
  {id:'athletic',name:'运动 X 型',swr:1.50,hwr:1.45,note:'肩和臀都有明显宽度'},
  {id:'ballet',name:'纤长芭蕾',swr:1.30,hwr:1.30,note:'整体线条纤细'}
];
const SAMPLES={
  a:{label:'样例 A',m:{swr:1.22,hwr:1.31},rounded:true,apt:false},
  b:{label:'样例 B',m:{swr:1.37,hwr:1.17},rounded:false,apt:true}
};
const EX={
  lat_raise:{name:'哑铃侧平举',reps:'12–15 次',steps:['站直，手肘微屈，哑铃在身体两侧','手肘带动手臂向两侧抬到与肩同高','顶端停 1 秒，2–3 秒慢慢放下'],cue:'想象把哑铃往远处推，而不是往上举',avoid:'耸肩、甩起来'},
  cable_lat:{name:'绳索单侧侧平举',reps:'12–15 次/侧',steps:['侧身站在绳索旁，远端的手握把手','手臂从身前向侧上方抬起','控制回落，做完换另一侧'],cue:'底部不要完全放松',avoid:'身体跟着倾斜'},
  band_lat:{name:'弹力带侧平举',reps:'15–20 次',steps:['双脚踩住弹力带中间','双手握两端，向两侧抬到与肩同高','慢慢放下'],cue:'适合在家练',avoid:'耸肩'},
  pulldown:{name:'高位下拉',reps:'10–12 次',steps:['握距略宽于肩，挺胸坐稳','手肘向下向后拉，横杆到锁骨附近','慢慢还原'],cue:'把手肘往裤兜方向拉',avoid:'身体大幅后仰'},

  band_pull:{name:'弹力带拉开',reps:'15–20 次',steps:['双手与肩同宽握弹力带，手臂前伸','向两侧拉开到胸前','慢慢还原'],cue:'肩膀往下沉',avoid:'耸肩'},

  dead_bug:{name:'死虫',reps:'8 次/侧',steps:['仰卧，手臂向上，屈髋屈膝 90°','对侧手脚同时慢慢伸远','还原后换另一侧'],cue:'腰始终贴地',avoid:'憋气、腰离地'},
  plank:{name:'平板支撑',reps:'30–45 秒',steps:['前臂撑地，手肘在肩膀正下方','身体成直线，收紧臀部','均匀呼吸'],cue:'骨盆微微后卷',avoid:'塌腰或撅臀'},
  hip_thrust:{name:'臀推',reps:'10–12 次',steps:['上背靠凳，哑铃放在髋部','脚跟发力，把髋推到与身体平齐','顶端夹紧 1 秒再放下'],cue:'下巴微收，肋骨下压',avoid:'用腰往上顶'},
  glute_bridge:{name:'臀桥',reps:'15 次',steps:['仰卧屈膝，双脚与髋同宽','脚跟发力把髋抬起','顶端夹紧臀部，慢慢放下'],cue:'适合在家练',avoid:'腰拱起'},
  band_walk:{name:'弹力带侧向走',reps:'15 步/侧',steps:['弹力带套在膝盖上方','半蹲，向一侧迈小步','走完换方向'],cue:'膝盖始终往外推',avoid:'身体左右晃'},
  side_leg:{name:'侧卧抬腿',reps:'15 次/侧',steps:['侧卧，下侧腿屈膝','上侧腿伸直，脚尖略朝下','向上抬到约 45°，慢慢放下'],cue:'腿略向后方抬',avoid:'髋向后翻'},

  chest_stretch:{name:'门框胸部拉伸',reps:'2×30 秒',steps:['前臂贴住门框，手肘与肩同高','身体慢慢向前','感受胸前拉伸'],cue:'肩膀不要耸起',avoid:'拉到疼'}
};
const MUSCLES={
  delt:{name:'三角肌中束',area:'肩部外侧',ex:['lat_raise','cable_lat','band_lat']},
  lats:{name:'背阔肌',area:'上背两侧',ex:['pulldown','db_row']},
  rear:{name:'后束 · 中下斜方',area:'肩后侧',ex:['face_pull','reverse_fly','band_pull']},
  pecs:{name:'胸大肌',area:'胸部',ex:['pushup']},
  core:{name:'核心',area:'腹部',ex:['dead_bug','plank']},
  gmax:{name:'臀大肌',area:'臀部',ex:['hip_thrust','glute_bridge']},
  gmed:{name:'臀中肌',area:'臀部外侧',ex:['band_walk','side_leg']},
  hams:{name:'腘绳肌',area:'大腿后侧',ex:['rdl','leg_curl']},
  quads:{name:'股四头肌',area:'大腿前侧',ex:['goblet','split_squat']}
};
const W={focus:3,boost:2,keep:1,less:.5};
const LVNAME={focus:'重点',boost:'加强',keep:'保持',less:'少量'};
const UPPER=['delt','lats','rear','pecs'], LOWER=['gmax','gmed','hams','quads'];
const DOW=['日','一','二','三','四','五','六'];
const SCHED={1:'A',3:'B',5:'C'}; // 周一 / 周三 / 周五

/* ---------------- state ---------------- */
const KEY='bodynav.v3';
const S={mode:'a',target:'square',rounded:true,apt:false,photoM:null,done:{},swap:{},voice:true,countVoice:true};
const T={photoURL:null,pts:null,photoM:null,coachKey:'A'};
try{const r=localStorage.getItem(KEY); if(r) Object.assign(S,JSON.parse(r));}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}};

/* ---------------- logic ---------------- */
const target=()=>TARGETS.find(t=>t.id===S.target)||TARGETS[0];
const cur=()=>S.mode==='photo'?S.photoM:SAMPLES[S.mode].m;
function analyze(){
  const m=cur(); if(!m) return null; const t=target();
  const dS=t.swr-m.swr, dH=t.hwr-m.hwr, L={};
  const up=(id,lv)=>{ if(!L[id]||W[lv]>W[L[id]]) L[id]=lv; };
  if(dS>=0.10){up('delt','focus');up('lats','boost');} else if(dS>=0.04){up('delt','boost');up('lats','boost');}
  if(dH>=0.10){up('gmed','focus');up('gmax','focus');} else if(dH>=0.04){up('gmed','boost');up('gmax','boost');}
  if(S.rounded){up('rear','focus'); L.pecs='less';}
  if(S.apt){up('gmax','boost');up('hams','boost');up('core','boost');}
  if(t.id==='ballet'&&dH<=0) L.quads='less';
  for(const id in MUSCLES) if(!L[id]) L[id]='keep';
  const wsum=Object.values(L).reduce((a,lv)=>a+W[lv],0);
  const sets={}; for(const id in L) sets[id]=Math.max(1,Math.round(36*W[L[id]]/wsum));
  const focus=Object.keys(L).filter(id=>L[id]==='focus');
  let head;
  if(Math.max(dS,dH)<0.04) head='已经很接近目标了';
  else if(dS>=dH) head='主要差在肩部宽度';
  else head='主要差在臀部外侧';
  return {m,t,dS,dH,L,sets,focus,head};
}
function weekPlan(r){
  const D={A:{name:'上肢',items:[]},B:{name:'下肢',items:[]},C:{name:'重点强化',items:[]}};
  const order=Object.keys(r.L).sort((a,b)=>W[r.L[b]]-W[r.L[a]]);
  for(const id of order){
    const lv=r.L[id], s=r.sets[id], g=UPPER.includes(id)?'A':LOWER.includes(id)?'B':'C';
    if(g!=='C' && (lv==='focus'||lv==='boost') && s>=4){
      const a=Math.ceil(s/2); D[g].items.push({mu:id,lv,sets:a}); D.C.items.push({mu:id,lv,sets:s-a,alt:1});
    } else D[g].items.push({mu:id,lv,sets:s});
  }
  if(S.rounded) D.A.items.push({mu:null,ex:'chest_stretch',lv:'keep',sets:1,stretch:1});
  if(S.apt) D.B.items.push({mu:null,ex:'hipflex_stretch',lv:'keep',sets:1,stretch:1});
  for(const k in D){ D[k].sets=D[k].items.reduce((a,it)=>a+(it.stretch?0:it.sets),0); D[k].min=Math.max(15,Math.round((D[k].sets*2.6+(D[k].items.some(i=>i.stretch)?3:0))/5)*5); }
  return D;
}
const exOf=(k,it)=>it.ex || S.swap[k+':'+it.mu] || MUSCLES[it.mu].ex[it.alt&&MUSCLES[it.mu].ex[1]?1:0];
function weekDates(){
  const now=new Date(); const mon=new Date(now); mon.setDate(now.getDate()-((now.getDay()+6)%7)); mon.setHours(0,0,0,0);
  return [0,1,2,3,4,5,6].map(i=>{const d=new Date(mon); d.setDate(mon.getDate()+i); return d;});
}
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const todayISO=()=>iso(new Date());
function dayProgress(date,key,plan){ const its=plan[key].items; const n=its.filter(it=>S.done[date+':'+exOf(key,it)]).length; return {n,total:its.length}; }

/* ---------------- drawing ---------------- */
function smooth(p){
  const F=v=>v.toFixed(1),n=p.length; let d=`M${F(p[0][0])},${F(p[0][1])}`;
  for(let i=0;i<n;i++){const a=p[(i-1+n)%n],b=p[i],c=p[(i+1)%n],e=p[(i+2)%n];
    d+=`C${F(b[0]+(c[0]-a[0])/6)},${F(b[1]+(c[1]-a[1])/6)} ${F(c[0]-(e[0]-b[0])/6)},${F(c[1]-(e[1]-b[1])/6)} ${F(c[0])},${F(c[1])}`;}
  return d+'Z';
}
function bodyPath(cx,hw,swr,hwr){
  const hS=hw*swr,hH=hw*hwr,ua=hw+(hS-hw)*.55;
  const R=[[9,62],[hS*.6,76],[hS,92],[hS*.94,114],[ua,135],[hw,185],[hH,232],[hH*.93,268],[hH*.68,330],[hH*.5,372],[hH*.44,410],[hH*.2,414],[hH*.17,372],[hH*.16,320],[4,280]];
  return smooth(R.map(([x,y])=>[cx+x,y]).concat(R.map(([x,y])=>[cx-x,y]).reverse()));
}
function figure(m,t){
  const w=34,cx=120;
  const lab=(y,d,x)=> d>=0.04?`<text x="${x.toFixed(1)}" y="${y+4}" style="fill:var(--warm);font:600 19px var(--mono)">+${f2(d)}</text>`:'';
  const arr=(y,a,b)=> b-a>1.2?[1,-1].map(k=>`<line x1="${(cx+k*a).toFixed(1)}" y1="${y}" x2="${(cx+k*b).toFixed(1)}" y2="${y}" style="stroke:var(--warm)" stroke-width="2.5" stroke-linecap="round"/>`).join(''):'';
  return `<svg viewBox="0 0 260 430" role="img" aria-label="实线为现在的身材，虚线为目标身材">
    <circle cx="${cx}" cy="40" r="20" style="fill:var(--body);stroke:var(--ink)" stroke-width="1.5"/>
    <path d="${bodyPath(cx,w,m.swr,m.hwr)}" style="fill:var(--body);stroke:var(--ink)" stroke-width="1.5"/>
    <path d="${bodyPath(cx,w,t.swr,t.hwr)}" style="fill:none;stroke:var(--accent)" stroke-width="2.2" stroke-dasharray="6 5"/>
    ${arr(92,w*m.swr,w*t.swr)}${arr(232,w*m.hwr,w*t.hwr)}
    ${lab(92,t.swr-m.swr,cx+w*Math.max(m.swr,t.swr)+8)}${lab(232,t.hwr-m.hwr,cx+w*Math.max(m.hwr,t.hwr)+8)}
  </svg>`;
}
const mini=t=>`<svg class="mini" viewBox="60 15 120 410" aria-hidden="true"><circle cx="120" cy="40" r="18" style="fill:none;stroke:var(--accent)" stroke-width="5" stroke-dasharray="10 8"/><path d="${bodyPath(120,34,t.swr,t.hwr)}" style="fill:none;stroke:var(--accent)" stroke-width="6" stroke-dasharray="14 10"/></svg>`;
function gapRow(name,c,tg){
  const lo=1.0,hi=1.6,pc=v=>Math.max(0,Math.min(100,(v-lo)/(hi-lo)*100)); const d=tg-c;
  return `<div class="gap"><span class="n">${name}</span>
    <div class="track"><span class="fill" style="width:${pc(c)}%"></span><span class="tgt" style="left:${pc(tg)}%"></span></div>
    <span class="v"><b>${f2(c)}</b> / ${f2(tg)}</span>
    <span class="d ${Math.abs(d)<0.04?'ok':''}">${Math.abs(d)<0.04?'已达标':(d>0?'还差 ':'超出 ')+f2(Math.abs(d))}</span></div>`;
}

/* ---------------- pages ---------------- */
const P={
  home:{root:1,title:'我的身材',render(){
    const r=analyze();
    if(!r) return `<div class="card" style="text-align:center;display:flex;flex-direction:column;gap:12px"><p class="big">先测一下你现在的身材</p><p class="muted small">上传一张正面全身照，30 秒得到你和目标的差距。</p><button class="btn" data-go="measure" type="button">开始测量</button></div>`;
    const plan=weekPlan(r), dates=weekDates(), today=todayISO();
    const strip=dates.map(d=>{const k=SCHED[d.getDay()], di=iso(d);
      let cls='rest', inner='·';
      if(k){ const p=dayProgress(di,k,plan); cls=(p.total&&p.n===p.total)?'done':'train'; inner=cls==='done'?I.check:plan[k].name[0]; }
      return `<div class="d"><span>${DOW[d.getDay()]}</span><span class="dot ${cls} ${di===today?'today':''}">${inner}</span></div>`;}).join('');
    const tk=SCHED[new Date().getDay()];

    if(tk){ const p=dayProgress(today,tk,plan); todayLine=`<p><b>今天 · ${plan[tk].name}</b><span class="muted small">　${plan[tk].items.length} 个动作 · 约 ${plan[tk].min} 分钟${p.n?` · 已完成 ${p.n}`:''}</span></p>`; btn=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><button class="btn" type="button" data-go="day" data-arg="${today}">开始今天训练</button><button class="btn ghost" type="button" data-go="plan">本周计划</button></div>`; }
    else { const nd=dates.find(d=>d>new Date()&&SCHED[d.getDay()]); todayLine=`<p><b>今天休息</b><span class="muted small">　${nd?'下次：周'+DOW[nd.getDay()]+' · '+plan[SCHED[nd.getDay()]].name:'下周一继续'}</span></p>`; btn=`<button class="btn" type="button" data-go="plan">查看训练计划</button>`; }

    </section>
    <section class="card" style="display:flex;flex-direction:column;gap:14px">
      <div style="display:flex;justify-content:space-between;align-items:baseline"><p class="label">本周训练</p><span class="muted small">练 3 天 · 休 4 天</span></div>
      <div class="week">${strip}</div>
      ${todayLine}
      ${btn}
    </section>`;
  }},
  plan:{title:'本周训练计划',render(){
    const r=analyze(); if(!r) return '';
    const plan=weekPlan(r), today=todayISO();
    const focusTxt=r.focus.length?r.focus.map(id=>MUSCLES[id].name).join('、'):'整体保持';

  day:{title:a=>{const d=new Date(a+'T00:00'); return `周${DOW[d.getDay()]} · ${{1:'上肢',3:'下肢',5:'重点强化'}[d.getDay()]||'训练'}`;},render(a){

/* exercise sheet */
function openEx(arg){
  const [date,k,i]=arg.split('|'); const plan=weekPlan(analyze()); const it=plan[k].items[+i];
  const sc=document.createElement('div'); sc.className='scrim'; sc.innerHTML='<div class="sheet" role="dialog" aria-modal="true" aria-label="动作详情"></div>';
  const draw=()=>{
    const e=exOf(k,it), ex=EX[e], done=!!S.done[date+':'+e];
    const alts=it.mu?MUSCLES[it.mu].ex:[];
    sc.querySelector('.sheet').innerHTML=`<div class="grab"></div>
      <div><p class="label">${it.mu?MUSCLES[it.mu].name+' · '+MUSCLES[it.mu].area:'拉伸'}</p><p class="big">${ex.name}</p><p class="mono small muted">${it.stretch?ex.reps:it.sets+' 组 × '+ex.reps}</p></div>
      <ol class="steps">${ex.steps.map(s=>`<li><span>${s}</span></li>`).join('')}</ol>
      <div class="tip"><b>要点</b>　${ex.cue}</div>
      <div class="tip warn"><b>避免</b>　${ex.avoid}</div>
      ${alts.length>1?`<div><p class="label" style="margin-bottom:8px">动作库 · 同部位可替换</p><div class="alts">${alts.map(x=>`<button class="alt" type="button" data-alt="${x}" aria-pressed="${x===e}">${EX[x].name}</button>`).join('')}</div></div>`:''}
      <button class="btn ${done?'ghost':''}" type="button" data-done="1">${done?I.check+' 已完成':'完成这个动作'}</button>`;
  };
  sc.addEventListener('click',ev=>{
    if(ev.target===sc){ sc.remove(); refresh(); return; }
    const a=ev.target.closest('[data-alt]'); if(a){ S.swap[k+':'+it.mu]=a.dataset.alt; save(); draw(); return; }
    if(ev.target.closest('[data-done]')){ const key=date+':'+exOf(k,it); const now=!S.done[key]; if(now) S.done[key]=1; else delete S.done[key]; save(); sc.remove(); refresh(); if(now) toast('完成：'+EX[exOf(k,it)].name); }
  });
  $('app').appendChild(sc); draw();
}

/* MediaPipe：先用和页面一起发布的本地文件（预览页的安全策略、国内网络都拦 CDN 和谷歌存储），失败再走 CDN */
const MP_LIB=[
  {lib:'mp/vision_bundle.mjs', wasm:'mp/wasm'},
  {lib:'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs', wasm:'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm'}
];
// GitHub Pages 上模型放在仓库根目录；预览页只托管固定类型的文件，模型以 .wasm 扩展名存放（内容一样）
const MP_MODEL=['pose_landmarker_lite.task','mp/pose_landmarker_lite.task.wasm','https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task'];
const absURL=u=>new URL(u,location.href).href;
let mpBase=null, mpP=null;
const mpLog=m=>{ console.log('[BodyNav] '+m); if(window.__mpdbg) window.__mpdbg(m); };
const withTimeout=(p,ms,what)=>Promise.race([p,new Promise((_,j)=>setTimeout(()=>j(new Error(what+' timeout')),ms))]);
async function firstOk(list,fn){ let last; for(const x of list){ try{ return await withTimeout(fn(x),90000,'load'); }catch(e){ last=e; mpLog('fail '+JSON.stringify(x).slice(0,60)+' '+(e&&e.message)); } } throw last||new Error('mediapipe'); }
function mpLoad(){
  if(mpBase) return Promise.resolve(mpBase);
  if(!mpP) mpP=mpLoad0().catch(e=>{ mpP=null; throw e; });
  return mpP;
}
async function mpLoad0(){
  const [lib,buf]=await Promise.all([
    firstOk(MP_LIB,async s=>{ mpLog('import '+s.lib); const v=await import(absURL(s.lib)); mpLog('fileset'); const fs=await v.FilesetResolver.forVisionTasks(absURL(s.wasm)); mpLog('lib ok'); return {v,fs}; }),
    firstOk(MP_MODEL,async u=>{ const r=await fetch(absURL(u)); if(!r.ok) throw new Error('model '+r.status); const b=new Uint8Array(await r.arrayBuffer()); if(b.length<100000) throw new Error('model too small'); return b; })
  ]);
  mpBase={...lib,buf}; return mpBase;
}
async function mkLandmarker(mode){
  const {v,fs,buf}=await mpLoad();
  const mk=d=>withTimeout(v.PoseLandmarker.createFromOptions(fs,{baseOptions:{modelAssetBuffer:buf,delegate:d},runningMode:mode,numPoses:1}),45000,'create');
  mpLog('create');
  try{ return await mk('GPU'); }catch(e){ mpLog('gpu fail '+(e&&e.message)); return await mk('CPU'); }
}
const TRK_OF={lat_raise:'abd',cable_lat:'abd',band_lat:'abd',reverse_fly:'abd',pulldown:'elbow',db_row:'elbow',face_pull:'elbow',band_pull:'spread',pushup:'push',goblet:'squat',split_squat:'split',rdl:'hinge',hip_thrust:'bridge',glute_bridge:'bridge',sl_bridge:'bridge',leg_curl:'curl',side_leg:'legabd',band_walk:'steps',plank:'plank',dead_bug:'hold',hipflex_stretch:'hold',chest_stretch:'hold'};
const MODE_LABEL=k=>({plank:'计时 · 体态检测',hold:'计时'}[k]||'自动计数');
let AR=1;
const pt=(L,i)=>({x:L[i].x*AR,y:L[i].y});
const seen=(L,ids)=>ids.every(i=>(L[i].visibility??1)>0.5);
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function ang(a,b,c){const ux=a.x-b.x,uy=a.y-b.y,vx=c.x-b.x,vy=c.y-b.y;return Math.abs(Math.atan2(ux*vy-uy*vx,ux*vx+uy*vy)*180/Math.PI);}
function side(L){const l=[11,13,15,23,25,27],r=[12,14,16,24,26,28];const sc=s=>s.reduce((a,i)=>a+(L[i].visibility??1),0);return (sc(l)>=sc(r)?l:r).map(i=>pt(L,i));}
const okIds=ids=>L=>seen(L,ids);
const okSide=L=>seen(L,[11,23,25,27])||seen(L,[12,24,26,28]);
const shrugGap=L=>((L[11].y-L[7].y)+(L[12].y-L[8].y))/2/Math.max(.01,Math.abs(L[11].x-L[12].x));
/* form checks: return a spoken correction or null */
const tooHigh=L=>(Math.min(L[11].y,L[12].y)-Math.min(L[15].y,L[16].y))>0.06?'到肩膀高度就停，别举太高':null;
const shrug=(L,c)=>(c.base&&seen(L,[7,8])&&shrugGap(L)<c.base*0.72)?'肩膀往下沉，别耸肩':null;
const bodyLine=L=>{const[s,,,h,,a]=side(L);return ang(s,h,a)<155?'收紧核心，身体保持一条直线':null;};
const valgus=(L,c,m)=>{if(m>135||!seen(L,[25,26,27,28]))return null;return Math.abs(L[25].x-L[26].x)<Math.abs(L[27].x-L[28].x)*0.8?'膝盖往外推，别内扣':null;};
const torso=L=>{const[s,,,h]=side(L);return Math.abs(Math.atan2(s.x-h.x,h.y-s.y)*180/Math.PI)>25?'上身保持直立':null;};
const kneeBend=L=>{const[,,,h,k,a]=side(L);return ang(h,k,a)<135?'膝盖微屈就好，髋往后推':null;};
const TRK={
  abd:{ok:okIds([11,12,13,14,23,24]),start:'lo',lo:30,hi:65,m:L=>(ang(pt(L,23),pt(L,11),pt(L,13))+ang(pt(L,24),pt(L,12),pt(L,14)))/2,checks:[tooHigh,shrug]},
  elbow:{ok:L=>seen(L,[11,13,15])||seen(L,[12,14,16]),start:'hi',lo:85,hi:145,m:L=>Math.min(ang(pt(L,11),pt(L,13),pt(L,15)),ang(pt(L,12),pt(L,14),pt(L,16)))},
  spread:{ok:okIds([11,12,15,16]),start:'lo',lo:1.5,hi:2.3,m:L=>dist(pt(L,15),pt(L,16))/dist(pt(L,11),pt(L,12)),checks:[shrug]},
  push:{ok:okSide,start:'hi',lo:95,hi:150,m:L=>{const[s,e,w]=side(L);return ang(s,e,w);},checks:[bodyLine]},
  squat:{ok:okSide,start:'hi',lo:110,hi:155,m:L=>{const[,,,h,k,a]=side(L);return ang(h,k,a);},checks:[valgus]},
  split:{ok:okSide,start:'hi',lo:110,hi:155,m:L=>{const[,,,h,k,a]=side(L);return ang(h,k,a);},checks:[torso]},
  hinge:{ok:okSide,start:'hi',lo:125,hi:160,m:L=>{const[s,,,h,k]=side(L);return ang(s,h,k);},checks:[kneeBend]},
  bridge:{ok:okSide,start:'lo',lo:145,hi:165,m:L=>{const[s,,,h,k]=side(L);return ang(s,h,k);}},
  curl:{ok:okSide,start:'hi',lo:100,hi:150,m:L=>{const[,,,h,k,a]=side(L);return ang(h,k,a);}},
  legabd:{ok:okIds([23,24,25,26]),start:'lo',lo:15,hi:30,m:L=>{const a=pt(L,23),b=pt(L,24);return ang(pt(L,25),{x:(a.x+b.x)/2,y:(a.y+b.y)/2},pt(L,26));}},
  steps:{ok:okIds([23,24,27,28]),start:'lo',lo:1.15,hi:1.6,m:L=>dist(pt(L,27),pt(L,28))/dist(pt(L,23),pt(L,24))},
  plank:{hold:true,ok:okSide,checks:[bodyLine]},
  hold:{hold:true,noPose:true,ok:()=>true}
};
function targetOf(e){
  const r=EX[e].reps, t=TRK[TRK_OF[e]]||TRK.hold, per=/侧/.test(r);
  if(t.hold){ const m=r.match(/(\d+)(?:–\d+)?\s*秒/); const s=m?+m[1]:40; return {hold:true,secs:per?s*2:s}; }
  const n=+((r.match(/\d+/)||[10])[0]); return {hold:false,reps:per?n*2:n};
}
function buildQueue(k){ const plan=weekPlan(analyze()); return plan[k].items.map(it=>{const e=exOf(k,it);return {e,sets:it.stretch?1:it.sets,tg:targetOf(e),trk:TRK_OF[e]||'hold'};}); }

/* voice */
const VLAST={};
function say(text,o={}){
  if(!S.voice||!('speechSynthesis' in window)) return;
  const now=Date.now(); if(o.key){ if(VLAST[o.key]&&now-VLAST[o.key]<(o.gap||6000)) return; VLAST[o.key]=now; }
  try{ if(o.urgent) speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.lang='zh-CN'; u.rate=1.08;
    const v=speechSynthesis.getVoices().find(x=>/zh[-_](CN|Hans)/i.test(x.lang)); if(v) u.voice=v; speechSynthesis.speak(u); }catch(e){}
}

function ui(){

  $('cdots').innerHTML=C.q.map((_,j)=>`<i class="${C.completed.has(j)?'on':j===C.i?'cur':''}"></i>`).join('');

      if(w<lo||w>hi) continue; if(!best||(pick==='min'?w<best.w:w>best.w)) best={y,w,e}; }
    return best; };
  const sB=scan(sy-tl*.02,sy+tl*.08,sj*1.02,sj*1.5,'max');
  const wB=scan(sy+tl*.45,hy-tl*.05,hj*.85,hj*1.65,'min');
  const hB=scan(hy-tl*.05,hy+tl*.28,hj*1.25,hj*2.15,'max');
  const wy=wB?wB.y:sy+tl*.68;
  T.pts={
    sl:sB?[sB.e[0],sB.y]:[sh[0].x-sj*.12,sh[0].y], sr:sB?[sB.e[1],sB.y]:[sh[1].x+sj*.12,sh[1].y],
    wl:wB?[wB.e[0],wy]:[hcx-hj*.62,wy], wr:wB?[wB.e[1],wy]:[hcx+hj*.62,wy],
    hl:hB?[hB.e[0],hB.y]:[hp[0].x-hj*.38,hp[0].y], hr:hB?[hB.e[1],hB.y]:[hp[1].x+hj*.38,hp[1].y]
  };
  pts();
  const est=[!sB&&'肩',!wB&&'腰',!hB&&'臀'].filter(Boolean);
  if(est.length&&T.photoM){ st.textContent+=`（${est.join('、')}被手臂挡住，是估算值，建议放大核对）`; }
}

render();
})();
